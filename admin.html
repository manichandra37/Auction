<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin – Review queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F6F7F9}
a{color:#0F2A44}a:hover{color:#1B4470}
input::placeholder,textarea::placeholder{color:#6B7684}
.side-list{flex-direction:column}
.side-foot{display:flex}
@media (max-width: 860px){
.side-list{flex-direction:row;overflow-x:auto}
.side-foot{display:none}
}
</style>
<style>
#dc-root div[style*="overflow-x: auto"]{position:relative}
@media (max-width:860px){aside{min-width:0}}
@media (max-width:520px){
header > div{gap:12px !important;padding-left:16px !important;padding-right:16px !important}
header a[style*="padding: 0 18px; height: 44px"]{padding:0 12px !important}
}
</style>

</head>
<body>
<template id="dc-tpl">
<div style="font-family: 'Inter', system-ui, sans-serif; color: #14202E; background: #F6F7F9; font-variant-numeric: tabular-nums; min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch">

<!-- Sidebar -->
<aside style="flex: 1 1 248px; background: #0F2A44; color: #FFFFFF; display: flex; flex-direction: column; gap: 20px; padding: 20px 14px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; padding: 0 8px; color: #FFFFFF; text-decoration: none">
<span style="width: 30px; height: 30px; border-radius: 8px; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0F2A44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V7l8-4 8 4v14"></path><path d="M9 21v-5h6v5"></path><path d="M9 10h.01M15 10h.01"></path></svg>
</span>
<span style="display: flex; flex-direction: column">
<span style="font-size: 16px; font-weight: 700">[Your brand]</span>
<span style="font-size: 11px; font-weight: 600; color: #9FB3C8; letter-spacing: 0.06em">ADMIN</span>
</span>
</a>
<nav aria-label="Admin">
<ul class="side-list" style="list-style: none; margin: 0; padding: 0; display: flex; gap: 2px">
<li><a href="#" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; background: rgba(255,255,255,0.12); color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600; white-space: nowrap">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7"></path><path d="m15 17 2 2 4-4"></path></svg>
<span style="flex: 1 1 auto">Review queue</span>
<template data-sc="if" value="{{hasQueue}}" hint-placeholder-val="{{true}}"><span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #FFFFFF; color: #0F2A44; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center" aria-label="{{queueLabel}}">{{queueCount}}</span></template>
</a></li>
<li><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #D3DDE8; text-decoration: none; font-size: 14px; font-weight: 500; white-space: nowrap">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18M7 15h4"></path></svg>Proof-of-funds checks</a></li>
<li><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #D3DDE8; text-decoration: none; font-size: 14px; font-weight: 500; white-space: nowrap">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"></path></svg>Live auctions</a></li>
<li><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #D3DDE8; text-decoration: none; font-size: 14px; font-weight: 500; white-space: nowrap">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"></path></svg>Flagged bids</a></li>
<li><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #D3DDE8; text-decoration: none; font-size: 14px; font-weight: 500; white-space: nowrap">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"></path></svg>Users</a></li>
<li><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #D3DDE8; text-decoration: none; font-size: 14px; font-weight: 500; white-space: nowrap">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0zM8 21h8"></path></svg>Disputes</a></li>
<li><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #D3DDE8; text-decoration: none; font-size: 14px; font-weight: 500; white-space: nowrap">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5M9 13h6M9 17h4"></path></svg>Audit log</a></li>
</ul>
</nav>
<div class="side-foot" style="margin-top: auto; align-items: center; gap: 10px; padding: 12px 8px 0; border-top: 1px solid rgba(255,255,255,0.12)">
<span style="width: 34px; height: 34px; border-radius: 999px; background: #E6EEF6; color: #0F2A44; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">PN</span>
<span style="display: flex; flex-direction: column">
<span style="font-size: 13px; font-weight: 600">Priya Nair</span>
<span style="font-size: 12px; color: #9FB3C8">Compliance reviewer</span>
</span>
</div>
</aside>

<!-- Main -->
<main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: #0F2A44">Review queue</h1>
<p style="margin: 0; font-size: 14px; color: #5A6675">New listings and buyer verifications waiting for approval</p>
</div>
<template data-sc="if" value="{{hasToast}}" hint-placeholder-val="{{false}}">
<p role="status" style="margin: 0; display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; background: #0F2A44; color: #FFFFFF; font-size: 13px; font-weight: 500">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>{{toast}}</p>
</template>
</div>

<section style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; border-bottom: 1px solid #E3E6EB">
<div role="group" aria-label="Queue" style="display: flex; gap: 4px">
<template data-sc="for" list="{{tabs}}" as="t" hint-placeholder-count="2">
<button type="button" aria-pressed="{{t.selected}}" onClick="{{t.pick}}" style="height: 52px; padding: 0 12px; background: transparent; border: 0; border-bottom: 2px solid {{t.bar}}; margin-bottom: -1px; color: {{t.color}}; font: inherit; font-size: 15px; font-weight: {{t.weight}}; cursor: pointer; white-space: nowrap">{{t.label}}</button>
</template>
</div>
<div style="position: relative; flex: 0 1 320px; min-width: 200px; padding: 8px 0">
<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search queue</label>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6675" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 12px; top: 22px"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input id="q" type="search" value="{{query}}" onChange="{{onQuery}}" placeholder="{{searchPh}}" style="width: 100%; box-sizing: border-box; height: 40px; border: 1px solid #C5CDD6; border-radius: 8px; padding: 0 12px 0 36px; font: inherit; font-size: 14px; color: #14202E">
</div>
</div>

<div style="overflow-x: auto">
<!-- Listings table -->
<template data-sc="if" value="{{isListings}}" hint-placeholder-val="{{true}}">
<table style="width: 100%; min-width: 1040px; border-collapse: collapse">
<caption style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Listings waiting for review</caption>
<thead><tr style="background: #F9FAFB">
<th scope="col" style="text-align: left; padding: 11px 16px; font-size: 12px; font-weight: 600; color: #4A5666; border-bottom: 1px solid #E9ECF0">Hotel</th>
<th scope="col" style="text-align: left; padding: 11px 12px; font-size: 12px; font-weight: 600; color: #4A5666; border-bottom: 1px solid #E9ECF0">Seller</th>
<th scope="col" style="text-align: left; padding: 11px 12px; font-size: 12px; font-weight: 600; color: #4A5666; border-bottom: 1px solid #E9ECF0">Submitted</th>
<th scope="col" style="text-align: right; padding: 11px 12px; font-size: 12px; font-weight: 600; color: #4A5666; border-bottom: 1px solid #E9ECF0">Keys</th>
<th scope="col" style="text-align: right; padding: 11px 12px; font-size: 12px; font-weight: 600; color: #4A5666; border-bottom: 1px solid #E9ECF0">Starting bid</th>
<th scope="col" style="text-align: left; padding: 11px 12px; font-size: 12px; font-weight: 600; color: #4A5666; border-bottom: 1px solid #E9ECF0">Checks</th>
<th scope="col" style="text-align: right; padding: 11px 16px; font-size: 12px; font-weight: 600; color: #4A5666; border-bottom: 1px solid #E9ECF0">Decision</th>
</tr></thead>
<tbody>
<template data-sc="for" list="{{listingRows}}" as="r" hint-placeholder-count="5">
<tr style="background: {{r.rowBg}}">
<td style="padding: 14px 16px; border-bottom: 1px solid #E9ECF0">
<span style="display: flex; flex-direction: column; gap: 2px">
<a href="#" style="font-size: 14px; font-weight: 600; color: #14202E; text-decoration: none">{{r.name}}</a>
<span style="font-size: 13px; color: #5A6675">{{r.city}}</span>
</span>
</td>
<td style="padding: 14px 12px; border-bottom: 1px solid #E9ECF0; font-size: 14px">{{r.seller}}</td>
<td style="padding: 14px 12px; border-bottom: 1px solid #E9ECF0; white-space: nowrap">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">{{r.date}}</span><span style="font-size: 12px; color: #5A6675">{{r.ago}}</span></span>
</td>
<td style="padding: 14px 12px; border-bottom: 1px solid #E9ECF0; text-align: right; font-size: 14px">{{r.keys}}</td>
<td style="padding: 14px 12px; border-bottom: 1px solid #E9ECF0; text-align: right; font-size: 14px; font-weight: 600; white-space: nowrap">{{r.start}}</td>
<td style="padding: 14px 12px; border-bottom: 1px solid #E9ECF0">
<span id="{{r.checkId}}" style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: {{r.chipBg}}; color: {{r.chipFg}}; border: 1px solid {{r.chipBorder}}">
<span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 999px; background: {{r.chipDot}}"></span>{{r.check}}</span>
</td>
<td style="padding: 14px 16px; border-bottom: 1px solid #E9ECF0; text-align: right; white-space: nowrap">
<template data-sc="if" value="{{r.pending}}" hint-placeholder-val="{{true}}">
<span style="display: inline-flex; gap: 8px">
<button type="button" onClick="{{r.reject}}" aria-label="{{r.rejectLabel}}" style="height: 38px; padding: 0 14px; border: 1px solid #E3B4AF; border-radius: 8px; background: #FFFFFF; color: #A3231C; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Reject</button>
<template data-sc="if" value="{{r.ok}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{r.approve}}" aria-label="{{r.approveLabel}}" style="height: 38px; padding: 0 16px; border: 0; border-radius: 8px; background: #0F2A44; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Approve</button>
</template>
<template data-sc="if" value="{{r.blocked}}" hint-placeholder-val="{{false}}">
<button type="button" disabled="{{true}}" aria-describedby="{{r.checkId}}" style="height: 38px; padding: 0 16px; border: 0; border-radius: 8px; background: #DDE2E8; color: #6B7684; font: inherit; font-size: 14px; font-weight: 600; cursor: not-allowed">Approve</button>
</template>
</span>
</template>
<template data-sc="if" value="{{r.done}}" hint-placeholder-val="{{false}}">
<span style="display: inline-flex; align-items: center; gap: 8px">
<span style="font-size: 13px; font-weight: 600; color: {{r.doneColor}}">{{r.doneText}}</span>
<button type="button" onClick="{{r.undo}}" style="height: 36px; padding: 0 6px; border: 0; background: transparent; color: #0F2A44; font: inherit; font-size: 13px; font-weight: 600; text-decoration: underline; cursor: pointer">Undo</button>
</span>
</template>
</td>
</tr>
</template>
</tbody>
</table>
</template>

<!-- Buyers table -->
<template data-sc="if" value="{{isBuyers}}" hint-placeholder-val="{{false}}">
<table style="width: 100%; min-width: 1040px; border-collapse: collapse">
<caption style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buyer verifications waiting for review</caption>
<thead><tr style="background: #F9FAFB">
<th scope="col" style="text-align: left; padding: 11px 16px; font-size: 12px; font-weight: 600; color: #4A5666; border-bottom: 1px solid #E9ECF0">Buyer</th>
<th scope="col" style="text-align: left; padding: 11px 12px; font-size: 12px; font-weight: 600; color: #4A5666; border-bottom: 1px solid #E9ECF0">Type</th>
<th scope="col" style="text-align: left; padding: 11px 12px; font-size: 12px; font-weight: 600; color: #4A5666; border-bottom: 1px solid #E9ECF0">Submitted</th>
<th scope="col" style="text-align: left; padding: 11px 12px; font-size: 12px; font-weight: 600; color: #4A5666; border-bottom: 1px solid #E9ECF0">Document</th>
<th scope="col" style="text-align: right; padding: 11px 12px; font-size: 12px; font-weight: 600; color: #4A5666; border-bottom: 1px solid #E9ECF0">Funds shown</th>
<th scope="col" style="text-align: left; padding: 11px 12px; font-size: 12px; font-weight: 600; color: #4A5666; border-bottom: 1px solid #E9ECF0">Checks</th>
<th scope="col" style="text-align: right; padding: 11px 16px; font-size: 12px; font-weight: 600; color: #4A5666; border-bottom: 1px solid #E9ECF0">Decision</th>
</tr></thead>
<tbody>
<template data-sc="for" list="{{buyerRows}}" as="r" hint-placeholder-count="2">
<tr style="background: {{r.rowBg}}">
<td style="padding: 14px 16px; border-bottom: 1px solid #E9ECF0">
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 600">{{r.name}}</span>
<span style="font-size: 13px; color: #5A6675">{{r.entity}}</span>
</span>
</td>
<td style="padding: 14px 12px; border-bottom: 1px solid #E9ECF0; font-size: 14px">{{r.type}}</td>
<td style="padding: 14px 12px; border-bottom: 1px solid #E9ECF0; white-space: nowrap">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">{{r.date}}</span><span style="font-size: 12px; color: #5A6675">{{r.ago}}</span></span>
</td>
<td style="padding: 14px 12px; border-bottom: 1px solid #E9ECF0"><a href="#" style="font-size: 14px; font-weight: 500">{{r.doc}}</a></td>
<td style="padding: 14px 12px; border-bottom: 1px solid #E9ECF0; text-align: right; font-size: 14px; font-weight: 600; white-space: nowrap">{{r.funds}}</td>
<td style="padding: 14px 12px; border-bottom: 1px solid #E9ECF0">
<span id="{{r.checkId}}" style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: {{r.chipBg}}; color: {{r.chipFg}}; border: 1px solid {{r.chipBorder}}">
<span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 999px; background: {{r.chipDot}}"></span>{{r.check}}</span>
</td>
<td style="padding: 14px 16px; border-bottom: 1px solid #E9ECF0; text-align: right; white-space: nowrap">
<template data-sc="if" value="{{r.pending}}" hint-placeholder-val="{{true}}">
<span style="display: inline-flex; gap: 8px">
<button type="button" onClick="{{r.reject}}" aria-label="{{r.rejectLabel}}" style="height: 38px; padding: 0 14px; border: 1px solid #E3B4AF; border-radius: 8px; background: #FFFFFF; color: #A3231C; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Reject</button>
<template data-sc="if" value="{{r.ok}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{r.approve}}" aria-label="{{r.approveLabel}}" style="height: 38px; padding: 0 16px; border: 0; border-radius: 8px; background: #0F2A44; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Approve</button>
</template>
<template data-sc="if" value="{{r.blocked}}" hint-placeholder-val="{{false}}">
<button type="button" disabled="{{true}}" aria-describedby="{{r.checkId}}" style="height: 38px; padding: 0 16px; border: 0; border-radius: 8px; background: #DDE2E8; color: #6B7684; font: inherit; font-size: 14px; font-weight: 600; cursor: not-allowed">Approve</button>
</template>
</span>
</template>
<template data-sc="if" value="{{r.done}}" hint-placeholder-val="{{false}}">
<span style="display: inline-flex; align-items: center; gap: 8px">
<span style="font-size: 13px; font-weight: 600; color: {{r.doneColor}}">{{r.doneText}}</span>
<button type="button" onClick="{{r.undo}}" style="height: 36px; padding: 0 6px; border: 0; background: transparent; color: #0F2A44; font: inherit; font-size: 13px; font-weight: 600; text-decoration: underline; cursor: pointer">Undo</button>
</span>
</template>
</td>
</tr>
</template>
</tbody>
</table>
</template>
</div>

<template data-sc="if" value="{{noResults}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 28px 16px; text-align: center; font-size: 14px; color: #5A6675">No matches for “{{query}}”.</p>
</template>

<div style="display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px; background: #F9FAFB; border-top: 1px solid #E9ECF0">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0F2A44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
<p style="margin: 0; font-size: 13px; color: #3D4A5A">{{noteText}} Approve stays locked until every check passes.</p>
</div>
</section>
</main>

<!-- Reject dialog -->
<template data-sc="if" value="{{rejecting}}" hint-placeholder-val="{{false}}">
<div style="position: fixed; inset: 0; z-index: 50; background: rgba(8,20,34,0.55); display: flex; align-items: center; justify-content: center; padding: 24px">
<section role="dialog" aria-modal="true" aria-labelledby="rj-title" style="width: 100%; max-width: 520px; background: #FFFFFF; border-radius: 14px; box-shadow: 0 24px 64px rgba(5,18,32,0.35); display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 20px 22px 14px; border-bottom: 1px solid #E9ECF0; display: flex; flex-direction: column; gap: 4px">
<h2 id="rj-title" style="margin: 0; font-size: 18px; font-weight: 700; color: #0F2A44">Reject {{rjName}}</h2>
<p style="margin: 0; font-size: 13px; color: #5A6675">{{rjSub}}</p>
</div>
<div style="padding: 18px 22px; display: flex; flex-direction: column; gap: 16px">
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600">Reason <span style="color: #A3231C">(required)</span></legend>
<template data-sc="for" list="{{reasons}}" as="o" hint-placeholder-count="5">
<label style="display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 14px; cursor: pointer">
<input type="radio" name="reject-reason" checked="{{o.checked}}" onChange="{{o.pick}}" style="width: 18px; height: 18px; margin: 0; accent-color: #0F2A44">{{o.label}}</label>
</template>
</fieldset>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="rj-msg" style="font-size: 14px; font-weight: 600">{{rjMsgLabel}}</label>
<textarea id="rj-msg" rows="4" value="{{rjMsg}}" onChange="{{onRjMsg}}" placeholder="Explain what needs to change" style="border: 1px solid #C5CDD6; border-radius: 8px; padding: 10px 12px; font: inherit; font-size: 14px; line-height: 1.5; color: #14202E; resize: vertical"></textarea>
</div>
</div>
<div style="padding: 14px 22px; border-top: 1px solid #E9ECF0; display: flex; justify-content: flex-end; gap: 10px">
<button type="button" onClick="{{cancelReject}}" style="height: 44px; padding: 0 16px; border: 1px solid #D5DAE1; border-radius: 8px; background: #FFFFFF; color: #0F2A44; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Cancel</button>
<button type="button" onClick="{{confirmReject}}" disabled="{{rjInvalid}}" style="height: 44px; padding: 0 16px; border: 0; border-radius: 8px; background: {{rjBtnBg}}; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{rjBtn}}</button>
</div>
</section>
</div>
</template>
</div>
</template>
<div id="dc-root"></div>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var tab = s.tab || 'listings';
    var query = s.query || '';
    var decisions = s.decisions || {};
    var rj = s.rj || null;

    var CHIP = {
      ok: { bg: '#E6F4EC', fg: '#145C38', border: '#BFE1CC', dot: '#1F7A4D' },
      warn: { bg: '#FDF0D5', fg: '#7A4A00', border: '#F2D49B', dot: '#C77C02' }
    };

    var listings = [
      { id: 'l1', name: 'Red Roof Inn Springfield North', city: 'Springfield, MO', seller: 'Ridgeway Hospitality LLC', date: 'Oct 22, 2:14 PM', ago: '1 day ago', keys: 92, start: '$3,100,000', check: 'Docs complete', ok: true },
      { id: 'l2', name: 'Comfort Suites Ozark', city: 'Ozark, MO', seller: 'Patel Hotel Group', date: 'Oct 23, 9:40 AM', ago: '9 hr ago', keys: 68, start: '$2,750,000', check: 'T-12 missing', ok: false },
      { id: 'l3', name: 'Holiday Inn Express Salina', city: 'Salina, KS', seller: 'Prairie Lodging Partners', date: 'Oct 23, 11:05 AM', ago: '8 hr ago', keys: 80, start: '$4,400,000', check: 'Franchise doc missing', ok: false },
      { id: 'l4', name: 'Bluebird Motel', city: 'Ely, MN', seller: 'Karen Lindqvist', date: 'Oct 23, 1:52 PM', ago: '5 hr ago', keys: 18, start: '$420,000', check: 'Seller not verified', ok: false },
      { id: 'l5', name: 'Cobblestone Inn & Suites Waverly', city: 'Waverly, IA', seller: 'Midwest Hotel Holdings', date: 'Oct 23, 4:30 PM', ago: '2 hr ago', keys: 46, start: '$1,950,000', check: 'Docs complete', ok: true }
    ];
    var buyers = [
      { id: 'b1', name: 'Anita Rao', entity: 'Meridian Hospitality Fund II', type: 'Fund', date: 'Oct 23, 10:12 AM', ago: '9 hr ago', doc: 'FundLetter_Meridian.pdf', funds: '$12,000,000', check: 'Docs complete', ok: true },
      { id: 'b2', name: 'Marcus Bell', entity: 'Individual', type: 'Individual', date: 'Oct 23, 3:48 PM', ago: '3 hr ago', doc: 'BankStatement_Sept.pdf', funds: '$1,500,000', check: 'Name mismatch', ok: false }
    ];

    function match(r) {
      if (!query) return true;
      var q = query.toLowerCase();
      return [r.name, r.city, r.seller, r.entity].join(' ').toLowerCase().indexOf(q) >= 0;
    }
    function decorate(r, kind) {
      var d = decisions[r.id];
      var c = r.ok ? CHIP.ok : CHIP.warn;
      return Object.assign({}, r, {
        chipBg: c.bg, chipFg: c.fg, chipBorder: c.border, chipDot: c.dot,
        checkId: 'chk-' + r.id,
        pending: !d, done: !!d, blocked: !r.ok,
        doneText: d === 'approved' ? 'Approved' : 'Rejected · email sent',
        doneColor: d === 'approved' ? '#14202E' : '#A3231C',
        rowBg: d ? '#FAFBFC' : '#FFFFFF',
        rejectLabel: 'Reject ' + r.name, approveLabel: 'Approve ' + r.name,
        approve: function () {
          var n = Object.assign({}, decisions); n[r.id] = 'approved';
          self.setState({ decisions: n, toast: r.name + ' approved' + (kind === 'listing' ? ' and scheduled for the seller.' : '.') });
        },
        reject: function () {
          self.setState({ rj: { id: r.id, name: r.name, kind: kind, who: kind === 'listing' ? r.seller : r.name }, reason: null, msg: '' });
        },
        undo: function () { var n = Object.assign({}, decisions); delete n[r.id]; self.setState({ decisions: n, toast: '' }); }
      });
    }

    var listingRows = listings.filter(match).map(function (r) { return decorate(r, 'listing'); });
    var buyerRows = buyers.filter(match).map(function (r) { return decorate(r, 'buyer'); });
    var openL = listings.filter(function (r) { return !decisions[r.id]; }).length;
    var openB = buyers.filter(function (r) { return !decisions[r.id]; }).length;

    var tabs = [['listings', 'Listings (' + openL + ')'], ['buyers', 'Buyer verification (' + openB + ')']].map(function (t) {
      var on = tab === t[0];
      return { label: t[1], selected: on, bar: on ? '#0F2A44' : 'transparent', color: on ? '#0F2A44' : '#5A6675', weight: on ? 600 : 500,
        pick: function () { self.setState({ tab: t[0] }); } };
    });

    var REASONS = rj && rj.kind === 'buyer'
      ? ['Name on document does not match', 'Funds shown are below the minimum', 'Document is older than 90 days', 'Document is unreadable', 'Other']
      : ['Required documents missing', 'Financials do not reconcile', 'Seller identity not verified', 'Property not eligible', 'Other'];
    var reason = s.reason;
    var reasons = REASONS.map(function (l) {
      return { label: l, checked: reason === l, pick: function () { self.setState({ reason: l }); } };
    });
    var msg = s.msg || '';
    var rjInvalid = !reason || (reason === 'Other' && !msg.trim());

    var total = openL + openB;
    var toast = s.toast || '';

    return {
      tabs: tabs,
      isListings: tab === 'listings', isBuyers: tab === 'buyers',
      listingRows: listingRows, buyerRows: buyerRows,
      noResults: (tab === 'listings' ? listingRows : buyerRows).length === 0,
      query: query, onQuery: function (e) { self.setState({ query: e.target.value }); },
      searchPh: tab === 'listings' ? 'Search hotel, city or seller' : 'Search buyer or entity',
      noteText: tab === 'listings' ? 'Reject requires a reason that is emailed to the seller.' : 'Reject requires a reason that is emailed to the buyer.',
      queueCount: total, hasQueue: total > 0, queueLabel: total + ' items waiting',
      hasToast: !!toast, toast: toast,
      rejecting: !!rj,
      rjName: rj ? rj.name : '',
      rjSub: rj ? 'The reason and message are emailed to ' + rj.who + '.' : '',
      rjMsgLabel: rj && rj.kind === 'buyer' ? 'Message to buyer' : 'Message to seller',
      reasons: reasons,
      rjMsg: msg, onRjMsg: function (e) { self.setState({ msg: e.target.value }); },
      rjInvalid: rjInvalid,
      rjBtnBg: rjInvalid ? '#D9A7A2' : '#B42318',
      rjBtn: rj && rj.kind === 'buyer' ? 'Reject and email buyer' : 'Reject and email seller',
      cancelReject: function () { self.setState({ rj: null }); },
      confirmReject: function () {
        if (rjInvalid) return;
        var n = Object.assign({}, decisions); n[rj.id] = 'rejected';
        self.setState({ decisions: n, rj: null, toast: rj.name + ' rejected. Email sent to ' + rj.who + '.' });
      }
    };
  }
}
DC.mount(Component, {});
</script>
</body>
</html>
