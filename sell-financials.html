<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>List your hotel: Financials · InnAuction</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0F2A44">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F6F7F9}
a{color:#0F2A44}a:hover{color:#1B4470}
input::placeholder{color:#6B7684}
.stepbar-full{display:flex}
.stepbar-compact{display:none}
.preview-side{position:sticky;top:24px}
.draft-text{display:inline-flex}
@media (max-width: 860px){
.stepbar-full{display:none}
.stepbar-compact{display:flex}
.preview-side{position:relative;top:auto}
.draft-text{display:none}
}
</style>
<style>
#dc-root div[style*="overflow-x: auto"]{position:relative}
@media (max-width:860px){aside{min-width:0}}
@media (max-width:520px){
header > div{gap:12px !important;padding-left:16px !important;padding-right:16px !important}
header a[style*="padding: 0 18px; height: 44px"]{padding:0 12px !important}
}
</style>

</head>
<body>
<template id="dc-tpl">
<div style="font-family: 'Inter', system-ui, sans-serif; color: #14202E; background: #F6F7F9; font-variant-numeric: tabular-nums; min-height: 100vh; display: flex; flex-direction: column">

<!-- Header -->
<header style="background: #0F2A44">
<div style="max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center; gap: 16px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF">
<span style="width: 30px; height: 30px; border-radius: 8px; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0F2A44" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.8 11.6 12 5.3l8.2 6.3"></path><circle cx="12" cy="13.9" r="2.45" fill="#0F2A44" stroke="none"></circle><path d="M10.5 15h3l.8 3.75h-4.6z" fill="#0F2A44" stroke="none"></path></svg>
</span>
<span style="font-size: 17px; font-weight: 700">Inn<span style="font-weight: 400">Auction</span></span>
</a>
<span aria-hidden="true" style="width: 1px; height: 24px; background: rgba(255,255,255,0.25)"></span>
<span style="color: #FFFFFF; font-size: 15px; font-weight: 600">List your hotel</span>
<div style="margin-left: auto; display: flex; align-items: center; gap: 16px">
<span class="draft-text" role="status" style="align-items: center; gap: 6px; color: #C9D6E3; font-size: 14px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>{{draftText}}</span>
<a href="seller-dashboard.html" style="height: 40px; padding: 0 16px; display: inline-flex; align-items: center; border: 1px solid rgba(255,255,255,0.4); border-radius: 8px; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600">Exit</a>
</div>
</div>
</header>

<!-- Step bar -->
<nav aria-label="Listing steps" style="background: #FFFFFF; border-bottom: 1px solid #E3E6EB">
<div style="max-width: 1200px; margin: 0 auto; padding: 0 24px">
<ol class="stepbar-full" style="list-style: none; margin: 0; padding: 0; align-items: stretch">
<template data-sc="for" list="{{steps}}" as="st" hint-placeholder-count="6">
<li aria-current="{{st.current}}" style="flex: 1 1 0; display: flex; align-items: center; gap: 10px; padding: 16px 4px 14px; border-bottom: 3px solid {{st.bar}}; min-width: 0">
<template data-sc="if" value="{{st.done}}" hint-placeholder-val="{{false}}">
<span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 999px; background: #0F2A44; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span>
</template>
<template data-sc="if" value="{{st.notDone}}" hint-placeholder-val="{{true}}">
<span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 999px; border: 2px solid {{st.ring}}; color: {{st.numColor}}; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{st.n}}</span>
</template>
<span style="font-size: 14px; font-weight: {{st.weight}}; color: {{st.labelColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{st.label}}</span>
</li>
</template>
</ol>
<div class="stepbar-compact" style="flex-direction: column; gap: 8px; padding: 14px 0">
<span style="font-size: 14px; font-weight: 700; color: #0F2A44">Step 2 of 6 · Financials</span>
<span style="height: 6px; border-radius: 999px; background: #E3E6EB; overflow: hidden; display: block"><span style="display: block; width: 33%; height: 100%; background: #0F2A44"></span></span>
</div>
</div>
</nav>

<main style="flex: 1 1 auto; max-width: 1200px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 32px 24px 40px; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">

<div style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: #0F2A44">Financials</h1>
<p style="margin: 0; font-size: 15px; color: #4A5666">Numbers buyers use to value your hotel. Use your most recent trailing-12-month P&amp;L.</p>
</div>

<!-- T-12 -->
<section aria-labelledby="h-t12" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="h-t12" style="margin: 0; font-size: 18px; font-weight: 700">Trailing 12 months</h2>
<p style="margin: 0; font-size: 13px; color: #5A6675">October 2025 through September 2026</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 16px 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-rev" style="font-size: 14px; font-weight: 600">Total revenue</label>
<span style="position: relative; display: flex"><span aria-hidden="true" style="position: absolute; left: 12px; top: 12px; font-size: 15px; color: #5A6675">$</span>
<input id="f-rev" type="text" inputmode="numeric" value="{{rev}}" onChange="{{onRev}}" style="width: 100%; box-sizing: border-box; height: 46px; border: 1px solid #C5CDD6; border-radius: 8px; padding: 0 12px 0 26px; font: inherit; font-size: 15px; color: #14202E; min-width: 0"></span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-rooms" style="font-size: 14px; font-weight: 600">Rooms revenue</label>
<span style="position: relative; display: flex"><span aria-hidden="true" style="position: absolute; left: 12px; top: 12px; font-size: 15px; color: #5A6675">$</span>
<input id="f-rooms" type="text" inputmode="numeric" value="{{rooms}}" onChange="{{onRooms}}" aria-describedby="rooms-hint" style="width: 100%; box-sizing: border-box; height: 46px; border: 1px solid {{roomsBorder}}; border-radius: 8px; padding: 0 12px 0 26px; font: inherit; font-size: 15px; color: #14202E; min-width: 0"></span>
<span id="rooms-hint" style="font-size: 12px; color: {{roomsHintColor}}">{{roomsHint}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-opex" style="font-size: 14px; font-weight: 600">Operating expenses</label>
<span style="position: relative; display: flex"><span aria-hidden="true" style="position: absolute; left: 12px; top: 12px; font-size: 15px; color: #5A6675">$</span>
<input id="f-opex" type="text" inputmode="numeric" value="{{opex}}" onChange="{{onOpex}}" style="width: 100%; box-sizing: border-box; height: 46px; border: 1px solid #C5CDD6; border-radius: 8px; padding: 0 12px 0 26px; font: inherit; font-size: 15px; color: #14202E; min-width: 0"></span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-noi" style="font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px">NOI <span style="font-size: 11px; font-weight: 600; color: #3D4A5A; background: #E9ECF0; padding: 2px 6px; border-radius: 4px">Auto</span></label>
<input id="f-noi" type="text" readonly="{{true}}" value="{{noiText}}" aria-describedby="noi-hint" style="height: 46px; border: 1px solid #E3E6EB; border-radius: 8px; padding: 0 12px; font: inherit; font-size: 15px; font-weight: 700; color: #0F2A44; background: #F3F5F8; min-width: 0">
<span id="noi-hint" style="font-size: 12px; color: #5A6675">Total revenue minus operating expenses</span>
</div>
</div>
<div style="height: 1px; background: #E9ECF0"></div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr)); gap: 16px 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-occ" style="font-size: 14px; font-weight: 600">Occupancy</label>
<span style="position: relative; display: flex">
<input id="f-occ" type="text" inputmode="decimal" value="{{occ}}" onChange="{{onOcc}}" style="width: 100%; box-sizing: border-box; height: 46px; border: 1px solid #C5CDD6; border-radius: 8px; padding: 0 30px 0 12px; font: inherit; font-size: 15px; color: #14202E; min-width: 0">
<span aria-hidden="true" style="position: absolute; right: 12px; top: 12px; font-size: 15px; color: #5A6675">%</span></span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-adr" style="font-size: 14px; font-weight: 600">ADR</label>
<span style="position: relative; display: flex"><span aria-hidden="true" style="position: absolute; left: 12px; top: 12px; font-size: 15px; color: #5A6675">$</span>
<input id="f-adr" type="text" inputmode="decimal" value="{{adr}}" onChange="{{onAdr}}" style="width: 100%; box-sizing: border-box; height: 46px; border: 1px solid #C5CDD6; border-radius: 8px; padding: 0 12px 0 26px; font: inherit; font-size: 15px; color: #14202E; min-width: 0"></span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-revpar" style="font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px">RevPAR <span style="font-size: 11px; font-weight: 600; color: #3D4A5A; background: #E9ECF0; padding: 2px 6px; border-radius: 4px">Auto</span></label>
<input id="f-revpar" type="text" readonly="{{true}}" value="{{revparText}}" aria-describedby="revpar-hint" style="height: 46px; border: 1px solid #E3E6EB; border-radius: 8px; padding: 0 12px; font: inherit; font-size: 15px; font-weight: 700; color: #0F2A44; background: #F3F5F8; min-width: 0">
<span id="revpar-hint" style="font-size: 12px; color: #5A6675">Occupancy × ADR</span>
</div>
</div>
</section>

<!-- Franchise -->
<section aria-labelledby="h-fr" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
<h2 id="h-fr" style="margin: 0; font-size: 18px; font-weight: 700">Franchise</h2>
<fieldset style="margin: 0; padding: 0; border: 0">
<legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600">Is the hotel branded?</legend>
<div style="display: inline-grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #C5CDD6; border-radius: 8px; overflow: hidden; min-width: min(100%, 320px)">
<template data-sc="for" list="{{brandOpts}}" as="o" hint-placeholder-count="2">
<label style="position: relative; display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; font-size: 14px; cursor: pointer; background: {{o.bg}}; color: {{o.fg}}; font-weight: {{o.weight}}">
<input type="radio" name="branded" checked="{{o.checked}}" onChange="{{o.pick}}" style="position: absolute; opacity: 0; width: 1px; height: 1px">{{o.label}}</label>
</template>
</div>
</fieldset>

<template data-sc="if" value="{{branded}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 16px 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-brand" style="font-size: 14px; font-weight: 600">Brand name</label>
<input id="f-brand" type="text" value="{{brand}}" onChange="{{onBrand}}" placeholder="e.g. Hampton Inn" style="height: 46px; border: 1px solid #C5CDD6; border-radius: 8px; padding: 0 12px; font: inherit; font-size: 15px; color: #14202E; min-width: 0">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-exp" style="font-size: 14px; font-weight: 600">Franchise expiry date</label>
<input id="f-exp" type="date" value="{{expiry}}" onChange="{{onExpiry}}" style="height: 46px; border: 1px solid #C5CDD6; border-radius: 8px; padding: 0 12px; font: inherit; font-size: 15px; color: #14202E; min-width: 0">
</div>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
<legend style="padding: 0; margin-bottom: 6px; font-size: 14px; font-weight: 600">PIP required on transfer?</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #C5CDD6; border-radius: 8px; overflow: hidden">
<template data-sc="for" list="{{pipOpts}}" as="o" hint-placeholder-count="2">
<label style="position: relative; display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 14px; cursor: pointer; background: {{o.bg}}; color: {{o.fg}}; font-weight: {{o.weight}}">
<input type="radio" name="pip" checked="{{o.checked}}" onChange="{{o.pick}}" style="position: absolute; opacity: 0; width: 1px; height: 1px">{{o.label}}</label>
</template>
</div>
</fieldset>
<template data-sc="if" value="{{pip}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-pip" style="font-size: 14px; font-weight: 600">Estimated PIP cost</label>
<span style="position: relative; display: flex"><span aria-hidden="true" style="position: absolute; left: 12px; top: 12px; font-size: 15px; color: #5A6675">$</span>
<input id="f-pip" type="text" inputmode="numeric" value="{{pipCost}}" onChange="{{onPip}}" style="width: 100%; box-sizing: border-box; height: 46px; border: 1px solid #C5CDD6; border-radius: 8px; padding: 0 12px 0 26px; font: inherit; font-size: 15px; color: #14202E; min-width: 0"></span>
</div>
</template>
</div>
</template>
<template data-sc="if" value="{{independent}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; font-size: 14px; color: #4A5666; background: #F6F7F9; border-radius: 8px; padding: 12px 14px">Independent hotels are shown with an "Independent (no franchise)" tag, which buyers can filter for.</p>
</template>
</section>

<!-- Documents -->
<section aria-labelledby="h-docs" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="h-docs" style="margin: 0; font-size: 18px; font-weight: 700">Supporting reports</h2>
<p style="margin: 0; font-size: 13px; color: #5A6675">Buyers see these only after signing your NDA.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px">
<template data-sc="for" list="{{uploads}}" as="u" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 600">{{u.title}}</span>
<template data-sc="if" value="{{u.has}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center; gap: 12px; min-height: 92px; box-sizing: border-box; padding: 12px 8px 12px 14px; border: 1px solid #E3E6EB; border-radius: 10px">
<span style="width: 36px; height: 36px; border-radius: 8px; background: #FDECEC; color: #A3231C; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0">PDF</span>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{u.name}}</span>
<span style="font-size: 12px; color: #3D4A5A">{{u.size}} · Uploaded</span>
</div>
<button type="button" aria-label="{{u.removeLabel}}" onClick="{{u.remove}}" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 8px; color: #3D4A5A; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6"></path><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M9 7V4h6v3"></path></svg>
</button>
</div>
</template>
<template data-sc="if" value="{{u.empty}}" hint-placeholder-val="{{false}}">
<label style="display: flex; align-items: center; gap: 12px; min-height: 92px; box-sizing: border-box; padding: 14px; border: 1.5px dashed #AEB8C4; border-radius: 10px; background: #F9FAFB; cursor: pointer">
<span style="width: 40px; height: 40px; border-radius: 999px; background: #E6EEF6; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F2A44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"></path><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; color: #14202E">Drop file or <span style="font-weight: 600; text-decoration: underline">browse</span></span>
<span style="font-size: 12px; color: #5A6675">{{u.hint}}</span>
</span>
<input type="file" accept=".pdf,.xlsx,.xls,.csv" onChange="{{u.onFile}}" aria-label="{{u.uploadLabel}}" style="position: absolute; width: 1px; height: 1px; opacity: 0">
</label>
</template>
</div>
</template>
</div>
</section>
</div>

<!-- Preview sidebar -->
<aside class="preview-side" aria-labelledby="h-prev" style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<h2 id="h-prev" style="margin: 0; font-size: 14px; font-weight: 700; color: #4A5666; letter-spacing: 0.02em">What buyers will see</h2>
<article style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; overflow: hidden">
<div style="position: relative; aspect-ratio: 16 / 9; background: #DFE3E8; display: flex; align-items: center; justify-content: center">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#A9B2BD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="m21 16-5-5-8 8"></path></svg>
<span style="position: absolute; left: 10px; bottom: 10px; height: 24px; padding: 0 8px; display: inline-flex; align-items: center; border-radius: 6px; background: #0F2A44; color: #FFFFFF; font-size: 11px; font-weight: 600">Limited-service</span>
</div>
<div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 600">Hampton Inn Springfield South</span>
<span style="font-size: 13px; color: #5A6675">Springfield, MO</span>
</div>
<span style="font-size: 13px; color: #3D4A5A">{{metaLine}}</span>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; background: #F6F7F9; border-radius: 8px; padding: 12px">
<div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 11px; color: #5A6675; font-weight: 500">Occupancy</dt><dd style="margin: 0; font-size: 16px; font-weight: 700">{{occText}}</dd></div>
<div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 11px; color: #5A6675; font-weight: 500">ADR</dt><dd style="margin: 0; font-size: 16px; font-weight: 700">{{adrText}}</dd></div>
<div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 11px; color: #5A6675; font-weight: 500">NOI (T-12)</dt><dd style="margin: 0; font-size: 16px; font-weight: 700">{{noiShort}}</dd></div>
<div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 11px; color: #5A6675; font-weight: 500">Cap rate</dt><dd style="margin: 0; font-size: 16px; font-weight: 700">{{capText}}</dd></div>
</dl>
</div>
</article>
<div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
<label for="f-price" style="font-size: 13px; font-weight: 600">Cap rate is estimated at a price of</label>
<span style="position: relative; display: flex"><span aria-hidden="true" style="position: absolute; left: 12px; top: 10px; font-size: 14px; color: #5A6675">$</span>
<input id="f-price" type="text" inputmode="numeric" value="{{price}}" onChange="{{onPrice}}" style="width: 100%; box-sizing: border-box; height: 40px; border: 1px solid #C5CDD6; border-radius: 8px; padding: 0 12px 0 24px; font: inherit; font-size: 14px; color: #14202E; min-width: 0"></span>
<span style="font-size: 12px; line-height: 1.45; color: #5A6675">On the live listing, cap rate updates with the current bid.</span>
</div>
</aside>
</main>

<!-- Footer -->
<div style="position: sticky; bottom: 0; background: #FFFFFF; border-top: 1px solid #E3E6EB; box-shadow: 0 -4px 12px rgba(15,42,68,0.05)">
<div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<a href="seller-dashboard.html" style="height: 46px; padding: 0 18px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid #D5DAE1; border-radius: 8px; color: #0F2A44; text-decoration: none; font-size: 15px; font-weight: 600">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>Back</a>
<div style="margin-left: auto; display: flex; flex-wrap: wrap; gap: 12px">
<button type="button" onClick="{{saveDraft}}" style="height: 46px; padding: 0 18px; border: 0; background: transparent; color: #0F2A44; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px">Save draft</button>
<a href="sell-auction-terms.html" style="height: 46px; padding: 0 20px; display: inline-flex; align-items: center; gap: 6px; border-radius: 8px; background: #0F2A44; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600">Continue to photos
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
</div>
</div>
</div>
</div>
</template>
<div id="dc-root"></div>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var KEYS = 64;
    function num(v) { return Number(String(v == null ? '' : v).replace(/[^0-9.]/g, '')) || 0; }
    function fmt(n) { return n ? Math.round(n).toLocaleString('en-US') : ''; }
    function money(n) { return '$' + Math.round(n).toLocaleString('en-US'); }
    function short(n) {
      if (Math.abs(n) >= 1000000) return '$' + (n / 1000000).toFixed(2).replace(/0$/, '') + 'M';
      if (Math.abs(n) >= 1000) return '$' + Math.round(n / 1000) + 'K';
      return money(n);
    }
    function g(k, d) { return s[k] === undefined ? d : s[k]; }
    function moneySetter(k) { return function (e) { var o = {}; o[k] = fmt(num(e.target.value)); self.setState(o); }; }
    function decSetter(k) { return function (e) { var o = {}; o[k] = String(e.target.value).replace(/[^0-9.]/g, ''); self.setState(o); }; }

    var rev = g('rev', '1,862,400'), rooms = g('rooms', '1,804,300'), opex = g('opex', '1,250,400');
    var occ = g('occ', '71.0'), adr = g('adr', '112.00'), price = g('price', '4,250,000');
    var noi = num(rev) - num(opex);
    var revpar = num(occ) / 100 * num(adr);
    var roomsBad = num(rooms) > num(rev) && num(rev) > 0;
    var cap = num(price) > 0 ? (noi / num(price) * 100) : 0;

    var branded = g('branded', true);
    var pip = g('pip', true);
    var brand = g('brand', 'Hampton Inn (Hilton)');

    var labels = ['Hotel details', 'Financials', 'Photos', 'Documents', 'Auction terms', 'Review'];
    var CUR = 2;
    var steps = labels.map(function (l, i) {
      var n = i + 1, done = n < CUR, cur = n === CUR;
      return {
        n: n, label: l, done: done, notDone: !done, current: cur ? 'step' : 'false',
        bar: cur ? '#0F2A44' : (done ? '#9DB0C4' : 'transparent'),
        ring: cur ? '#0F2A44' : '#C5CDD6', numColor: cur ? '#0F2A44' : '#5A6675',
        weight: cur ? 700 : 500, labelColor: cur ? '#0F2A44' : (done ? '#3D4A5A' : '#5A6675')
      };
    });

    function seg(cur, opts, key) {
      return opts.map(function (o) {
        var on = cur === o[0];
        return { label: o[1], checked: on, bg: on ? '#0F2A44' : '#FFFFFF', fg: on ? '#FFFFFF' : '#14202E', weight: on ? 600 : 500,
          pick: function () { var st = {}; st[key] = o[0]; self.setState(st); } };
      });
    }

    var files = g('files', { t12: { name: 'T12_PL_Sep2026.pdf', size: '840 KB' }, str: null });
    var uploads = [
      { id: 't12', title: 'T-12 P&L', hint: 'PDF or Excel · required' },
      { id: 'str', title: 'STR report', hint: 'PDF · most recent month' }
    ].map(function (u) {
      var f = files[u.id];
      return {
        title: u.title, hint: u.hint, has: !!f, empty: !f,
        name: f ? f.name : '', size: f ? f.size : '',
        removeLabel: 'Remove ' + u.title, uploadLabel: 'Upload ' + u.title,
        remove: function () { var n = Object.assign({}, files); n[u.id] = null; self.setState({ files: n }); },
        onFile: function (e) {
          var x = e.target.files && e.target.files[0]; if (!x) return;
          var n = Object.assign({}, files);
          n[u.id] = { name: x.name, size: x.size > 1048576 ? (x.size / 1048576).toFixed(1) + ' MB' : Math.round(x.size / 1024) + ' KB' };
          self.setState({ files: n });
        }
      };
    });

    return {
      draftText: g('justSaved', false) ? 'Draft saved just now' : 'Draft saved 2 min ago',
      saveDraft: function () { self.setState({ justSaved: true }); },
      steps: steps,
      rev: rev, rooms: rooms, opex: opex, occ: occ, adr: adr, price: price,
      onRev: moneySetter('rev'), onRooms: moneySetter('rooms'), onOpex: moneySetter('opex'), onPrice: moneySetter('price'),
      onOcc: decSetter('occ'), onAdr: decSetter('adr'),
      roomsBorder: roomsBad ? '#C8372D' : '#C5CDD6',
      roomsHintColor: roomsBad ? '#A3231C' : '#5A6675',
      roomsHint: roomsBad ? 'Rooms revenue can’t be more than total revenue.' : 'Part of total revenue',
      noiText: money(noi),
      revparText: '$' + revpar.toFixed(2),
      brandOpts: seg(branded ? 'b' : 'i', [['b', 'Branded'], ['i', 'Independent']], 'brandedKey').map(function (o, i) {
        o.pick = function () { self.setState({ branded: i === 0 }); }; return o;
      }),
      branded: branded, independent: !branded,
      brand: brand, onBrand: function (e) { self.setState({ brand: e.target.value }); },
      expiry: g('expiry', '2031-06-30'), onExpiry: function (e) { self.setState({ expiry: e.target.value }); },
      pipOpts: seg(pip ? 'y' : 'n', [['y', 'Yes'], ['n', 'No']], 'pipKey').map(function (o, i) {
        o.pick = function () { self.setState({ pip: i === 0 }); }; return o;
      }),
      pip: pip, pipCost: g('pipCost', '900,000'), onPip: moneySetter('pipCost'),
      uploads: uploads,
      metaLine: KEYS + ' keys · Built 2004 · ' + (branded ? (brand || 'Branded') + ' flag' : 'Independent'),
      occText: num(occ).toFixed(0) + '%',
      adrText: '$' + Math.round(num(adr)),
      noiShort: short(noi),
      capText: cap.toFixed(1) + '%'
    };
  }
}
DC.mount(Component, {});
</script>
</body>
</html>
