<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>List your hotel – Auction terms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F6F7F9}
a{color:#0F2A44}a:hover{color:#1B4470}
input::placeholder{color:#6B7684}
input:disabled{background:#F3F5F8;color:#8A94A1}
.stepbar-full{display:flex}
.stepbar-compact{display:none}
.preview-side{position:sticky;top:24px}
.draft-text{display:inline-flex}
@media (max-width: 860px){
.stepbar-full{display:none}
.stepbar-compact{display:flex}
.preview-side{position:relative;top:auto}
.draft-text{display:none}
}
</style>
<style>
#dc-root div[style*="overflow-x: auto"]{position:relative}
@media (max-width:860px){aside{min-width:0}}
@media (max-width:520px){
header > div{gap:12px !important;padding-left:16px !important;padding-right:16px !important}
header a[style*="padding: 0 18px; height: 44px"]{padding:0 12px !important}
}
</style>

</head>
<body>
<template id="dc-tpl">
<div style="font-family: 'Inter', system-ui, sans-serif; color: #14202E; background: #F6F7F9; font-variant-numeric: tabular-nums; min-height: 100vh; display: flex; flex-direction: column">

<!-- Header -->
<header style="background: #0F2A44">
<div style="max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center; gap: 16px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF">
<span style="width: 30px; height: 30px; border-radius: 8px; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0F2A44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V7l8-4 8 4v14"></path><path d="M9 21v-5h6v5"></path><path d="M9 10h.01M15 10h.01"></path></svg>
</span>
<span style="font-size: 17px; font-weight: 700">[Your brand]</span>
</a>
<span aria-hidden="true" style="width: 1px; height: 24px; background: rgba(255,255,255,0.25)"></span>
<span style="color: #FFFFFF; font-size: 15px; font-weight: 600">List your hotel</span>
<div style="margin-left: auto; display: flex; align-items: center; gap: 16px">
<span class="draft-text" role="status" style="align-items: center; gap: 6px; color: #C9D6E3; font-size: 14px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>{{draftText}}</span>
<a href="seller-dashboard.html" style="height: 40px; padding: 0 16px; display: inline-flex; align-items: center; border: 1px solid rgba(255,255,255,0.4); border-radius: 8px; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600">Exit</a>
</div>
</div>
</header>

<!-- Step bar -->
<nav aria-label="Listing steps" style="background: #FFFFFF; border-bottom: 1px solid #E3E6EB">
<div style="max-width: 1200px; margin: 0 auto; padding: 0 24px">
<ol class="stepbar-full" style="list-style: none; margin: 0; padding: 0; align-items: stretch">
<template data-sc="for" list="{{steps}}" as="st" hint-placeholder-count="6">
<li aria-current="{{st.current}}" style="flex: 1 1 0; display: flex; align-items: center; gap: 10px; padding: 16px 4px 14px; border-bottom: 3px solid {{st.bar}}; min-width: 0">
<template data-sc="if" value="{{st.done}}" hint-placeholder-val="{{true}}">
<span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 999px; background: #0F2A44; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span>
</template>
<template data-sc="if" value="{{st.notDone}}" hint-placeholder-val="{{false}}">
<span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 999px; border: 2px solid {{st.ring}}; color: {{st.numColor}}; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{st.n}}</span>
</template>
<span style="font-size: 14px; font-weight: {{st.weight}}; color: {{st.labelColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{st.label}}</span>
</li>
</template>
</ol>
<div class="stepbar-compact" style="flex-direction: column; gap: 8px; padding: 14px 0">
<span style="font-size: 14px; font-weight: 700; color: #0F2A44">Step 5 of 6 · Auction terms</span>
<span style="height: 6px; border-radius: 999px; background: #E3E6EB; overflow: hidden; display: block"><span style="display: block; width: 83%; height: 100%; background: #0F2A44"></span></span>
</div>
</div>
</nav>

<main style="flex: 1 1 auto; max-width: 1200px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 32px 24px 40px; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">

<div style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: #0F2A44">Auction terms</h1>
<p style="margin: 0; font-size: 15px; color: #4A5666">Set your price floor, schedule and who can bid. You can change these until the auction starts.</p>
</div>

<!-- Pricing -->
<section aria-labelledby="h-price" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
<h2 id="h-price" style="margin: 0; font-size: 18px; font-weight: 700">Pricing</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 16px 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-start" style="font-size: 14px; font-weight: 600">Starting bid</label>
<span style="position: relative; display: flex"><span aria-hidden="true" style="position: absolute; left: 12px; top: 12px; font-size: 15px; color: #5A6675">$</span>
<input id="f-start" type="text" inputmode="numeric" value="{{startBid}}" onChange="{{onStart}}" style="width: 100%; box-sizing: border-box; height: 46px; border: 1px solid #C5CDD6; border-radius: 8px; padding: 0 12px 0 26px; font: inherit; font-size: 15px; color: #14202E; min-width: 0"></span>
<span style="font-size: 12px; color: #5A6675">The first bid must be at least this amount.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-reserve" style="font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px">Reserve price
<span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #3D4A5A; background: #E9ECF0; padding: 2px 6px; border-radius: 4px">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 6.1A10 10 0 0 1 12 6c5 0 9 6 9 6a17 17 0 0 1-2.6 3.2M6.6 6.6C4.3 8.1 3 12 3 12s4 6 9 6a9 9 0 0 0 4-.9"></path></svg>Hidden</span></label>
<span style="position: relative; display: flex"><span aria-hidden="true" style="position: absolute; left: 12px; top: 12px; font-size: 15px; color: {{reserveSymbol}}">$</span>
<input id="f-reserve" type="text" inputmode="numeric" value="{{reserve}}" onChange="{{onReserve}}" disabled="{{noReserve}}" aria-describedby="reserve-hint" style="width: 100%; box-sizing: border-box; height: 46px; border: 1px solid {{reserveBorder}}; border-radius: 8px; padding: 0 12px 0 26px; font: inherit; font-size: 15px; color: #14202E; min-width: 0"></span>
<span id="reserve-hint" style="font-size: 12px; color: {{reserveHintColor}}">{{reserveHint}}</span>
</div>
</div>
<label style="display: flex; gap: 10px; align-items: flex-start; cursor: pointer">
<input type="checkbox" checked="{{noReserve}}" onChange="{{toggleNoReserve}}" style="width: 18px; height: 18px; margin: 1px 0 0; accent-color: #0F2A44; flex-shrink: 0">
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 600">No reserve</span>
<span style="font-size: 13px; color: #4A5666">The highest bid wins, whatever the amount.</span>
</span>
</label>
<div style="display: flex; flex-direction: column; gap: 6px; max-width: 320px">
<label for="f-inc" style="font-size: 14px; font-weight: 600">Bid increment</label>
<select id="f-inc" value="{{increment}}" onChange="{{onIncrement}}" style="height: 46px; border: 1px solid #C5CDD6; border-radius: 8px; padding: 0 10px; font: inherit; font-size: 15px; color: #14202E; background: #FFFFFF">
<option value="5000">$5,000</option>
<option value="10000">$10,000</option>
<option value="25000">$25,000</option>
<option value="50000">$50,000</option>
<option value="100000">$100,000</option>
</select>
<span style="font-size: 12px; color: #5A6675">Each new bid must beat the current bid by at least this much.</span>
</div>
</section>

<!-- Schedule -->
<section aria-labelledby="h-sched" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
<h2 id="h-sched" style="margin: 0; font-size: 18px; font-weight: 700">Schedule</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 16px 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-sd" style="font-size: 14px; font-weight: 600">Start date</label>
<input id="f-sd" type="date" value="{{startDate}}" onChange="{{onStartDate}}" style="height: 46px; border: 1px solid #C5CDD6; border-radius: 8px; padding: 0 12px; font: inherit; font-size: 15px; color: #14202E; min-width: 0">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-st" style="font-size: 14px; font-weight: 600">Start time</label>
<input id="f-st" type="time" value="{{startTime}}" onChange="{{onStartTime}}" style="height: 46px; border: 1px solid #C5CDD6; border-radius: 8px; padding: 0 12px; font: inherit; font-size: 15px; color: #14202E; min-width: 0">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-ed" style="font-size: 14px; font-weight: 600">End date</label>
<input id="f-ed" type="date" value="{{endDate}}" onChange="{{onEndDate}}" style="height: 46px; border: 1px solid {{endBorder}}; border-radius: 8px; padding: 0 12px; font: inherit; font-size: 15px; color: #14202E; min-width: 0">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-et" style="font-size: 14px; font-weight: 600">End time</label>
<input id="f-et" type="time" value="{{endTime}}" onChange="{{onEndTime}}" style="height: 46px; border: 1px solid {{endBorder}}; border-radius: 8px; padding: 0 12px; font: inherit; font-size: 15px; color: #14202E; min-width: 0">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; max-width: 320px">
<label for="f-tz" style="font-size: 14px; font-weight: 600">Time zone</label>
<select id="f-tz" value="{{tz}}" onChange="{{onTz}}" style="height: 46px; border: 1px solid #C5CDD6; border-radius: 8px; padding: 0 10px; font: inherit; font-size: 15px; color: #14202E; background: #FFFFFF">
<option value="ET">Eastern Time (ET)</option>
<option value="CT">Central Time (CT)</option>
<option value="MT">Mountain Time (MT)</option>
<option value="PT">Pacific Time (PT)</option>
<option value="AKT">Alaska Time (AKT)</option>
<option value="HT">Hawaii Time (HT)</option>
</select>
</div>
<div style="display: flex; gap: 10px; align-items: flex-start; background: {{schedBg}}; border-radius: 10px; padding: 12px 14px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{schedFg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: {{schedFg}}">{{schedNote}}</p>
</div>
</section>

<!-- Bidder requirements -->
<section aria-labelledby="h-req" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
<h2 id="h-req" style="margin: 0; font-size: 18px; font-weight: 700">Bidder requirements</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 16px 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-dep" style="font-size: 14px; font-weight: 600">Required bidder deposit</label>
<span style="position: relative; display: flex"><span aria-hidden="true" style="position: absolute; left: 12px; top: 12px; font-size: 15px; color: #5A6675">$</span>
<input id="f-dep" type="text" inputmode="numeric" value="{{deposit}}" onChange="{{onDeposit}}" style="width: 100%; box-sizing: border-box; height: 46px; border: 1px solid #C5CDD6; border-radius: 8px; padding: 0 12px 0 26px; font: inherit; font-size: 15px; color: #14202E; min-width: 0"></span>
<span style="font-size: 12px; color: #5A6675">Refundable. Released to bidders who don't win.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-prem" style="font-size: 14px; font-weight: 600">Buyer's premium</label>
<span style="position: relative; display: flex">
<input id="f-prem" type="text" inputmode="decimal" value="{{premium}}" onChange="{{onPremium}}" placeholder="[X]" style="width: 100%; box-sizing: border-box; height: 46px; border: 1px solid #C5CDD6; border-radius: 8px; padding: 0 30px 0 12px; font: inherit; font-size: 15px; color: #14202E; min-width: 0">
<span aria-hidden="true" style="position: absolute; right: 12px; top: 12px; font-size: 15px; color: #5A6675">%</span></span>
<span style="font-size: 12px; color: #5A6675">Added to the winning bid and paid by the buyer.</span>
</div>
</div>
<label style="display: flex; gap: 10px; align-items: flex-start; cursor: pointer">
<input type="checkbox" checked="{{pofOnly}}" onChange="{{togglePof}}" style="width: 18px; height: 18px; margin: 1px 0 0; accent-color: #0F2A44; flex-shrink: 0">
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 600">Only bidders with verified proof of funds</span>
<span style="font-size: 13px; color: #4A5666">Bidders must pass our proof-of-funds review before they can place a bid.</span>
</span>
</label>
</section>
</div>

<!-- Preview sidebar -->
<aside class="preview-side" aria-labelledby="h-prev" style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<h2 id="h-prev" style="margin: 0; font-size: 14px; font-weight: 700; color: #4A5666; letter-spacing: 0.02em">What buyers will see</h2>
<div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; overflow: hidden">
<div style="padding: 16px 18px; border-bottom: 1px solid #E9ECF0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; font-weight: 600">Hampton Inn Springfield South</span>
<span style="font-size: 13px; color: #5A6675">Springfield, MO · 64 keys</span>
</div>
<div style="padding: 16px 18px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 600; color: #4A5666">Starting bid</span>
<span style="font-size: 30px; line-height: 1.1; font-weight: 700; color: #0F2A44; letter-spacing: -0.02em">{{startText}}</span>
<span style="margin-top: 6px; align-self: flex-start; display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #E9ECF0; color: #3D4A5A">{{reserveTag}}</span>
</div>
<dl style="margin: 0; padding: 0 18px 16px; display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid #E9ECF0"><dt style="font-size: 13px; color: #5A6675">Opens</dt><dd style="margin: 0; font-size: 13px; font-weight: 600; text-align: right">{{opensText}}</dd></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid #E9ECF0"><dt style="font-size: 13px; color: #5A6675">Ends</dt><dd style="margin: 0; font-size: 13px; font-weight: 600; text-align: right">{{endsText}}</dd></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid #E9ECF0"><dt style="font-size: 13px; color: #5A6675">Increment</dt><dd style="margin: 0; font-size: 13px; font-weight: 600">{{incText}}</dd></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid #E9ECF0"><dt style="font-size: 13px; color: #5A6675">Bidder deposit</dt><dd style="margin: 0; font-size: 13px; font-weight: 600">{{depText}}</dd></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid #E9ECF0"><dt style="font-size: 13px; color: #5A6675">Buyer's premium</dt><dd style="margin: 0; font-size: 13px; font-weight: 600">{{premText}}</dd></div>
</dl>
<template data-sc="if" value="{{pofOnly}}" hint-placeholder-val="{{true}}">
<div style="padding: 12px 18px; background: #F6F7F9; border-top: 1px solid #E9ECF0; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #14202E">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F2A44" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"></path><path d="m9 12 2 2 4-4"></path></svg>Verified proof of funds required</div>
</template>
</div>
<p style="margin: 0; font-size: 12px; line-height: 1.5; color: #5A6675">Your reserve amount is never shown. Buyers only see whether it has been met.</p>
</aside>
</main>

<!-- Footer -->
<div style="position: sticky; bottom: 0; background: #FFFFFF; border-top: 1px solid #E3E6EB; box-shadow: 0 -4px 12px rgba(15,42,68,0.05)">
<div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<a href="sell-financials.html" style="height: 46px; padding: 0 18px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid #D5DAE1; border-radius: 8px; color: #0F2A44; text-decoration: none; font-size: 15px; font-weight: 600">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>Back</a>
<div style="margin-left: auto; display: flex; flex-wrap: wrap; gap: 12px">
<button type="button" onClick="{{saveDraft}}" style="height: 46px; padding: 0 18px; border: 0; background: transparent; color: #0F2A44; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px">Save draft</button>
<a href="seller-dashboard.html" style="height: 46px; padding: 0 20px; display: inline-flex; align-items: center; gap: 6px; border-radius: 8px; background: #0F2A44; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600">Continue to review
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
</div>
</div>
</div>
</div>
</template>
<div id="dc-root"></div>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    function g(k, d) { return s[k] === undefined ? d : s[k]; }
    function num(v) { return Number(String(v == null ? '' : v).replace(/[^0-9.]/g, '')) || 0; }
    function fmt(n) { return n ? Math.round(n).toLocaleString('en-US') : ''; }
    function money(n) { return '$' + Math.round(n).toLocaleString('en-US'); }
    function setter(k, kind) {
      return function (e) {
        var o = {}; var v = e.target.value;
        o[k] = kind === 'money' ? fmt(num(v)) : kind === 'dec' ? String(v).replace(/[^0-9.]/g, '') : v;
        self.setState(o);
      };
    }

    var labels = ['Hotel details', 'Financials', 'Photos', 'Documents', 'Auction terms', 'Review'];
    var CUR = 5;
    var steps = labels.map(function (l, i) {
      var n = i + 1, done = n < CUR, cur = n === CUR;
      return {
        n: n, label: l, done: done, notDone: !done, current: cur ? 'step' : 'false',
        bar: cur ? '#0F2A44' : (done ? '#9DB0C4' : 'transparent'),
        ring: cur ? '#0F2A44' : '#C5CDD6', numColor: cur ? '#0F2A44' : '#5A6675',
        weight: cur ? 700 : 500, labelColor: cur ? '#0F2A44' : (done ? '#3D4A5A' : '#5A6675')
      };
    });

    var startBid = g('startBid', '3,500,000');
    var reserve = g('reserve', '4,100,000');
    var noReserve = g('noReserve', false);
    var increment = g('increment', '25000');
    var startDate = g('startDate', '2026-11-09'), startTime = g('startTime', '10:00');
    var endDate = g('endDate', '2026-11-23'), endTime = g('endTime', '19:00');
    var tz = g('tz', 'CT');
    var deposit = g('deposit', '50,000');
    var premium = g('premium', '');
    var pofOnly = g('pofOnly', true);

    var reserveLow = !noReserve && num(reserve) > 0 && num(reserve) < num(startBid);

    var D = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    function parse(d, t) {
      var a = String(d).split('-'), b = String(t || '00:00').split(':');
      if (a.length < 3) return null;
      return new Date(+a[0], +a[1] - 1, +a[2], +b[0] || 0, +b[1] || 0);
    }
    function nice(dt) {
      if (!dt || isNaN(dt)) return '—';
      var h = dt.getHours(), m = dt.getMinutes(), ap = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return D[dt.getDay()] + ', ' + M[dt.getMonth()] + ' ' + dt.getDate() + ' · ' + h + ':' + (m < 10 ? '0' : '') + m + ' ' + ap + ' ' + tz;
    }
    var sdt = parse(startDate, startTime), edt = parse(endDate, endTime);
    var diff = sdt && edt ? (edt - sdt) / 3600000 : 0;
    var badSched = !(diff > 0);
    var days = Math.floor(diff / 24), hours = Math.round(diff - days * 24);
    var runs = days + (days === 1 ? ' day' : ' days') + (hours ? ' ' + hours + (hours === 1 ? ' hour' : ' hours') : '');

    return {
      draftText: g('justSaved', false) ? 'Draft saved just now' : 'Draft saved 2 min ago',
      saveDraft: function () { self.setState({ justSaved: true }); },
      steps: steps,
      startBid: startBid, onStart: setter('startBid', 'money'),
      reserve: noReserve ? '' : reserve, onReserve: setter('reserve', 'money'),
      noReserve: noReserve, toggleNoReserve: function () { self.setState({ noReserve: !noReserve }); },
      reserveSymbol: noReserve ? '#A9B2BD' : '#5A6675',
      reserveBorder: reserveLow ? '#C8372D' : (noReserve ? '#E3E6EB' : '#C5CDD6'),
      reserveHintColor: reserveLow ? '#A3231C' : '#5A6675',
      reserveHint: noReserve ? 'Turned off. The highest bid wins.' : (reserveLow ? 'Reserve must be at least the starting bid.' : 'Never shown to bidders. They only see whether it has been met.'),
      increment: increment, onIncrement: setter('increment'),
      startDate: startDate, startTime: startTime, endDate: endDate, endTime: endTime, tz: tz,
      onStartDate: setter('startDate'), onStartTime: setter('startTime'), onEndDate: setter('endDate'), onEndTime: setter('endTime'), onTz: setter('tz'),
      endBorder: badSched ? '#C8372D' : '#C5CDD6',
      schedBg: badSched ? '#FDECEC' : '#EEF3F8',
      schedFg: badSched ? '#8E1D17' : '#0F2A44',
      schedNote: badSched ? 'The end must be after the start.' : 'Auction runs ' + runs + '. Bids in the last 2 minutes extend it by 2 minutes.',
      deposit: deposit, onDeposit: setter('deposit', 'money'),
      premium: premium, onPremium: setter('premium', 'dec'),
      pofOnly: pofOnly, togglePof: function () { self.setState({ pofOnly: !pofOnly }); },
      startText: num(startBid) ? money(num(startBid)) : '—',
      reserveTag: noReserve ? 'No reserve' : 'Reserve price set (hidden)',
      opensText: nice(sdt), endsText: nice(edt),
      incText: money(num(increment)),
      depText: num(deposit) ? money(num(deposit)) + ' refundable' : '—',
      premText: premium ? premium + '%' : '[X]%'
    };
  }
}
DC.mount(Component, {});
</script>
