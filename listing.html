<div id="dc-root"></div>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    this._timer = setInterval(function () {
      var s = self.state || {};
      var t = s.t == null ? 4365 : s.t;
      self.setState({ t: t > 0 ? t - 1 : 0 });
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this._timer); }

  renderVals() {
    var self = this;
    var s = this.state || {};
    var INC = 25000, NOI = 612000, KEYS = 64;
    function money(v) { return '$' + Math.round(v).toLocaleString('en-US'); }
    function pad(n) { return (n < 10 ? '0' : '') + n; }

    var propWinning = (this.props.bidState || 'outbid') === 'winning';
    var placed = !!s.placed;
    var winning = propWinning || placed;
    var current = placed ? s.current : 4250000;
    var minBid = current + INC;

    var raw = s.input == null ? money(minBid) : s.input;
    var amount = Number(String(raw).replace(/[^0-9]/g, '')) || 0;
    var invalid = amount < minBid;
    var isMax = !!s.isMax;

    var t = s.t == null ? 4365 : s.t;
    var timeLeft = pad(Math.floor(t / 3600)) + ':' + pad(Math.floor((t % 3600) / 60)) + ':' + pad(t % 60);

    var base = propWinning ? [
      { who: 'You', amt: 4250000, time: '2 min ago', me: true },
      { who: 'Bidder 7', amt: 4225000, time: '6 min ago' },
      { who: 'Bidder 3', amt: 4200000, time: '14 min ago' },
      { who: 'Bidder 7', amt: 4175000, time: '21 min ago' },
      { who: 'Bidder 12', amt: 4150000, time: '38 min ago' }
    ] : [
      { who: 'Bidder 7', amt: 4250000, time: '2 min ago' },
      { who: 'You', amt: 4225000, time: '6 min ago', me: true },
      { who: 'Bidder 3', amt: 4200000, time: '14 min ago' },
      { who: 'Bidder 7', amt: 4175000, time: '21 min ago' },
      { who: 'Bidder 12', amt: 4150000, time: '38 min ago' }
    ];
    var rows = (s.extra || []).concat(base).slice(0, 6);
    var history = rows.map(function (r, i) {
      var top = i === 0;
      return {
        who: r.who, amt: money(r.amt), time: r.time,
        isWin: r.me && top && winning, isOut: r.me && !top && i === 1 && !winning,
        bg: r.me ? '#F3F6FA' : 'transparent', weight: r.me ? 700 : 500
      };
    });

    var watching = !!s.watching;
    var photos = ['Exterior, front entrance', 'Lobby and breakfast area', 'King guest room', 'Indoor pool', 'Fitness room'];
    var sel = s.photo || 0;
    var thumbs = [1, 2, 3, 4].map(function (i) {
      return {
        label: photos[i].split(',')[0], aria: 'Show photo: ' + photos[i] + (i === 4 ? '. Plus 28 more photos' : ''),
        selected: sel === i, border: sel === i ? '#0F2A44' : 'transparent', last: i === 4,
        pick: function () { self.setState({ photo: sel === i ? 0 : i }); }
      };
    });

    var locked = !s.unlocked;
    var docList = [
      ['T-12 P&L', 'PDF · 14 pages · Through Sep 2026'],
      ['STR report', 'PDF · 22 pages · August 2026'],
      ['3-year tax returns', 'PDF · 3 files · 2023 to 2025'],
      ['Franchise agreement', 'PDF · 61 pages · Expires 2031'],
      ['PIP report', 'PDF · 18 pages · Hilton, July 2026'],
      ['Title report', 'PDF · 9 pages · Sep 2026'],
      ['Environmental Phase I', 'PDF · 47 pages · June 2026']
    ];
    var docs = docList.map(function (d) { return { name: d[0], meta: d[1], locked: locked, open: !locked }; });

    var capAt = (NOI / current * 100).toFixed(1) + '%';
    var ppk = money(Math.round(current / KEYS / 100) * 100);
    var keyNumbers = [
      { label: 'Keys', value: '64' },
      { label: 'Occupancy (T-12)', value: '71%' },
      { label: 'ADR', value: '$112' },
      { label: 'RevPAR', value: '$79.52' },
      { label: 'Revenue (T-12)', value: '$1.86M' },
      { label: 'NOI (T-12)', value: '$612K' },
      { label: 'Cap rate at current bid', value: capAt },
      { label: 'Price per key', value: ppk }
    ];

    var hintText = invalid
      ? 'Enter ' + money(minBid) + ' or more (increment $25,000).'
      : 'Next minimum ' + money(minBid) + ' (increment $25,000)';

    var winSub = placed
      ? (s.maxAmt ? 'Your max bid is ' + money(s.maxAmt) + '. We will bid for you up to it.' : 'Your bid of ' + money(current) + ' is leading.')
      : 'Your bid of $4,250,000 is leading.';

    return {
      outbid: !winning, winning: winning, winSub: winSub,
      timeLeft: timeLeft,
      currentText: money(current), minBidText: money(minBid),
      bidCount: 18 + (s.extra ? s.extra.length : 0),
      watchCount: 42 + (watching ? 1 : 0),
      inputText: raw,
      onInput: function (e) {
        var n = Number(String(e.target.value).replace(/[^0-9]/g, ''));
        self.setState({ input: n ? money(n) : '' });
      },
      inputBorder: invalid ? '#C8372D' : '#C5CDD6',
      hintColor: invalid ? '#A3231C' : '#4A5666',
      hintText: hintText,
      isMax: isMax,
      toggleMax: function () { self.setState({ isMax: !isMax }); },
      invalid: invalid,
      btnBg: invalid ? '#8DA99A' : '#1F7A4D',
      btnLabel: (isMax ? 'Set max bid ' : 'Bid ') + money(Math.max(amount, 0)),
      placeBid: function () {
        if (invalid) return;
        var newCurrent = isMax ? minBid : amount;
        self.setState({
          placed: true, current: newCurrent, maxAmt: isMax ? amount : null, input: null,
          extra: [{ who: 'You', amt: newCurrent, time: 'Just now', me: true }].concat(s.extra || [])
        });
      },
      history: history,
      watching: watching,
      toggleWatch: function () { self.setState({ watching: !watching }); },
      watchLabel: watching ? 'Watching' : 'Watch',
      watchBg: watching ? '#0F2A44' : '#FFFFFF',
      watchFg: watching ? '#FFFFFF' : '#0F2A44',
      watchBorder: watching ? '#0F2A44' : '#D5DAE1',
      watchFill: watching ? 'currentColor' : 'none',
      mainPhoto: photos[sel], photoCount: (sel + 1) + ' / 32',
      thumbs: thumbs,
      keyNumbers: keyNumbers,
      locked: locked,
      unlock: function () { self.setState({ unlocked: true }); },
      ddSub: locked ? '7 documents · Sign the NDA once to unlock all of them' : 'NDA signed Oct 23, 2026 · All 7 documents unlocked',
      docs: docs,
      pinLabel: money(current).replace(/,\d{3},\d{3}$/, function (m) { return '.' + m.charAt(1) + 'M'; }),
      barStatus: winning ? 'Winning' : 'Outbid',
      barStatusColor: winning ? '#145C38' : '#A3231C'
    };
  }
}
DC.mount(Component, {"bidState":"outbid"});
</script>
</body>
