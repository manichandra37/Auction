<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register to bid – Sign NDA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#0F2A44}a:hover{color:#1B4470}
</style>
<style>
#dc-root div[style*="overflow-x: auto"]{position:relative}
@media (max-width:860px){aside{min-width:0}}
@media (max-width:520px){
header > div{gap:12px !important;padding-left:16px !important;padding-right:16px !important}
header a[style*="padding: 0 18px; height: 44px"]{padding:0 12px !important}
}
</style>
<style>
body{min-height:100vh;background:#3A4656 !important;padding:48px 16px;box-sizing:border-box}
#dc-root{display:flex;justify-content:center}
#dc-root > section[role=dialog]{width:min(560px,100%) !important;height:auto !important;min-height:780px;box-shadow:0 24px 64px rgba(5,18,32,.4)}
@media (max-width:600px){body{padding:0}#dc-root > section[role=dialog]{border-radius:0 !important;min-height:100vh}}
</style>
</head>
<body>
<template id="dc-tpl">
<section role="dialog" aria-modal="true" aria-labelledby="s1-title" style="width: 560px; height: 820px; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; color: #14202E; background: #FFFFFF; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden">

<div style="padding: 20px 22px 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; border-bottom: 1px solid #E9ECF0">
<div style="display: flex; flex-direction: column; gap: 3px">
<h2 id="s1-title" style="margin: 0; font-size: 19px; font-weight: 700; color: #0F2A44">Register to bid</h2>
<p style="margin: 0; font-size: 12px; color: #5A6675">Hampton Inn Springfield South</p>
</div>
<a href="listing.html" aria-label="Close" style="width: 44px; height: 44px; margin: -8px -10px 0 0; display: inline-flex; align-items: center; justify-content: center; color: #3D4A5A">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
</a>
</div>

<ol aria-label="Registration steps" style="list-style: none; margin: 0; padding: 14px 22px; display: flex; align-items: center; gap: 8px; background: #F9FAFB; border-bottom: 1px solid #E9ECF0">
<li aria-current="step" style="display: flex; align-items: center; gap: 8px; flex-shrink: 0">
<span style="width: 26px; height: 26px; border-radius: 999px; border: 2px solid #0F2A44; color: #0F2A44; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">1</span>
<span style="font-size: 13px; font-weight: 700; color: #0F2A44">Sign NDA</span>
</li>
<li aria-hidden="true" style="flex: 1 1 auto; height: 2px; background: #DDE2E8"></li>
<li style="display: flex; align-items: center; gap: 8px; flex-shrink: 0">
<span style="width: 26px; height: 26px; border-radius: 999px; border: 2px solid #C5CDD6; color: #5A6675; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">2</span>
<span style="font-size: 13px; color: #5A6675">Proof of funds</span>
</li>
<li aria-hidden="true" style="flex: 1 1 auto; height: 2px; background: #DDE2E8"></li>
<li style="display: flex; align-items: center; gap: 8px; flex-shrink: 0">
<span style="width: 26px; height: 26px; border-radius: 999px; border: 2px solid #C5CDD6; color: #5A6675; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">3</span>
<span style="font-size: 13px; color: #5A6675">Deposit</span>
</li>
</ol>

<div style="padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; flex: 1 1 auto; min-height: 0">
<div style="display: flex; flex-direction: column; gap: 4px">
<h3 style="margin: 0; font-size: 17px; font-weight: 700">Sign the non-disclosure agreement</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #3D4A5A">One NDA covers every document for this hotel.</p>
</div>

<div tabindex="0" role="region" aria-label="NDA text" style="height: 230px; overflow-y: auto; border: 1px solid #D5DAE1; border-radius: 10px; padding: 14px 16px; background: #F9FAFB; font-size: 13px; line-height: 1.6; color: #2B3746; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-weight: 700; color: #14202E">Confidentiality Agreement</p>
<p style="margin: 0">1. Confidential information. "Confidential Information" means all financial statements, STR reports, tax returns, franchise documents, property condition reports and any other materials about the property made available to you through the data room.</p>
<p style="margin: 0">2. Use. You will use the Confidential Information only to evaluate a purchase of the property and for no other purpose.</p>
<p style="margin: 0">3. Disclosure. You will not share Confidential Information with anyone other than your lenders, partners, attorneys and advisors who need it for the evaluation and who are bound by duties of confidentiality.</p>
<p style="margin: 0">4. No contact. You will not contact the hotel's staff, guests, franchisor or vendors about the sale without the seller's written consent.</p>
<p style="margin: 0">5. Return or destruction. If you do not acquire the property, you will delete or destroy the Confidential Information on request.</p>
<p style="margin: 0">6. Term. This agreement stays in effect for two years from the date you sign it.</p>
</div>

<label style="display: flex; gap: 10px; align-items: flex-start; cursor: pointer">
<input type="checkbox" checked="{{agreed}}" onChange="{{toggleAgree}}" style="width: 18px; height: 18px; margin: 1px 0 0; accent-color: #0F2A44; flex-shrink: 0">
<span style="font-size: 14px; color: #14202E">I agree to the confidentiality agreement</span>
</label>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="sig" style="font-size: 14px; font-weight: 600">Type your full legal name to sign</label>
<input id="sig" type="text" value="{{sig}}" onChange="{{onSig}}" style="height: 44px; border: 1px solid #C5CDD6; border-radius: 8px; padding: 0 12px; font: inherit; font-size: 15px; color: #14202E">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 4px 4px 0; border-bottom: 1px solid #14202E">
<span style="font-family: 'Caveat', cursive; font-size: 30px; line-height: 1.2; color: #0F2A44">{{sig}}</span>
<span style="font-size: 12px; color: #5A6675; padding-bottom: 6px">Oct 23, 2026</span>
</div>
</div>
</div>

<div style="padding: 14px 22px; border-top: 1px solid #E9ECF0; display: flex; justify-content: space-between; gap: 12px">
<a href="listing.html" style="height: 46px; padding: 0 18px; display: inline-flex; align-items: center; border: 1px solid #D5DAE1; border-radius: 8px; color: #0F2A44; text-decoration: none; font-size: 15px; font-weight: 600">Cancel</a>
<template data-sc="if" value="{{ready}}" hint-placeholder-val="{{true}}">
<a href="register-funds.html" style="height: 46px; padding: 0 20px; display: inline-flex; align-items: center; border-radius: 8px; background: #0F2A44; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600">Sign and continue</a>
</template>
<template data-sc="if" value="{{notReady}}" hint-placeholder-val="{{false}}">
<button type="button" disabled="{{true}}" style="height: 46px; padding: 0 20px; border: 0; border-radius: 8px; background: #C5CDD6; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; cursor: not-allowed">Sign and continue</button>
</template>
</div>
</section>
</template>
<div id="dc-root"></div>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var agreed = s.agreed === undefined ? true : s.agreed;
    var sig = s.sig === undefined ? 'Daniel R. Whitaker' : s.sig;
    var ready = agreed && sig.trim().length > 1;
    return {
      agreed: agreed, sig: sig, ready: ready, notReady: !ready,
      toggleAgree: function () { self.setState({ agreed: !agreed }); },
      onSig: function (e) { self.setState({ sig: e.target.value }); }
    };
  }
}
DC.mount(Component, {});
</script>
</body>
</html>
