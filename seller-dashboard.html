<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seller dashboard · InnAuction</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0F2A44">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F6F7F9}
a{color:#0F2A44}a:hover{color:#1B4470}
textarea::placeholder,input::placeholder{color:#6B7684}
.site-nav{display:flex}
.menu-btn{display:none}
@media (max-width: 920px){.site-nav{display:none}.menu-btn{display:inline-flex}}
</style>
<style>
#dc-root div[style*="overflow-x: auto"]{position:relative}
@media (max-width:860px){aside{min-width:0}}
@media (max-width:520px){
header > div{gap:12px !important;padding-left:16px !important;padding-right:16px !important}
header a[style*="padding: 0 18px; height: 44px"]{padding:0 12px !important}
}
</style>

</head>
<body>
<template id="dc-tpl">
<div style="font-family: 'Inter', system-ui, sans-serif; color: #14202E; background: #F6F7F9; font-variant-numeric: tabular-nums; min-height: 100vh">

<!-- Header (signed in) -->
<header style="background: #0F2A44">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 24px; height: 72px; display: flex; align-items: center; gap: 32px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF; flex-shrink: 0">
<span style="width: 32px; height: 32px; border-radius: 8px; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0F2A44" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.8 11.6 12 5.3l8.2 6.3"></path><circle cx="12" cy="13.9" r="2.45" fill="#0F2A44" stroke="none"></circle><path d="M10.5 15h3l.8 3.75h-4.6z" fill="#0F2A44" stroke="none"></path></svg>
</span>
<span style="font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Inn<span style="font-weight: 400">Auction</span></span>
</a>
<nav class="site-nav" aria-label="Main" style="align-items: center; gap: 4px; flex: 1 1 auto">
<a href="search.html" style="color: #D3DDE8; text-decoration: none; font-size: 15px; font-weight: 500; padding: 12px 14px; border-radius: 8px">Buy hotels</a>
<a href="#" aria-current="page" style="color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600; padding: 12px 14px; border-radius: 8px; background: rgba(255,255,255,0.1)">Sell a hotel</a>
<a href="index.html" style="color: #D3DDE8; text-decoration: none; font-size: 15px; font-weight: 500; padding: 12px 14px; border-radius: 8px">How it works</a>
<a href="my-bids.html" style="color: #D3DDE8; text-decoration: none; font-size: 15px; font-weight: 500; padding: 12px 14px; border-radius: 8px">My bids</a>
</nav>
<div style="display: flex; align-items: center; gap: 10px; margin-left: auto">
<a href="#" aria-label="Notifications, 2 unread" style="position: relative; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; color: #FFFFFF">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21h4"></path></svg>
<span aria-hidden="true" style="position: absolute; top: 6px; right: 5px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #D92D20; color: #FFFFFF; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; border: 2px solid #0F2A44">2</span>
</a>
<button type="button" aria-label="Account menu for Ruth Ridgeway" style="width: 40px; height: 40px; border-radius: 999px; border: 0; background: #E6EEF6; color: #0F2A44; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">RR</button>
<button type="button" class="menu-btn" aria-label="Open menu" style="width: 44px; height: 44px; align-items: center; justify-content: center; background: transparent; border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; color: #FFFFFF; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
</button>
</div>
</div>
</header>

<main style="max-width: 1280px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; color: #0F2A44">My listings</h1>
<p style="margin: 0; font-size: 15px; color: #5A6675">Ridgeway Hospitality LLC · 6 hotels</p>
</div>
<a href="sell-financials.html" style="height: 44px; padding: 0 18px; display: inline-flex; align-items: center; gap: 8px; border-radius: 8px; background: #0F2A44; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>List another hotel</a>
</div>

<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px">

<!-- 1. LIVE -->
<li style="background: #FFFFFF; border: 1px solid #C9D3DE; border-radius: 12px; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; padding: 16px 20px">
<div style="flex: 3 1 300px; display: flex; align-items: center; gap: 14px; min-width: 0">
<span aria-hidden="true" style="width: 72px; height: 54px; border-radius: 8px; background: #DFE3E8; flex-shrink: 0"></span>
<span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<a href="listing.html" style="font-size: 16px; font-weight: 600; color: #14202E; text-decoration: none">Hampton Inn Springfield South</a>
<span style="font-size: 13px; color: #5A6675">Springfield, MO · 64 keys</span>
</span>
</div>
<div style="flex: 1 1 150px">
<span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: #0F2A44; color: #FFFFFF; font-size: 12px; font-weight: 600"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 999px; background: #7FD4A6"></span>Live</span>
</div>
<div style="flex: 1 1 150px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #5A6675">Current bid</span>
<span style="font-size: 17px; font-weight: 700; color: #0F2A44">$4,250,000</span>
</div>
<div style="flex: 1 1 150px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start">
<span style="font-size: 12px; color: #5A6675">Ends in</span>
<span style="display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 999px; background: #FDF0D5; border: 1px solid #F2D49B; color: #7A4A00; font-size: 13px; font-weight: 700">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{liveEnds}}</span>
</div>
<div style="flex: 0 0 auto; margin-left: auto">
<button type="button" aria-expanded="{{liveOpen}}" aria-controls="live-panel" onClick="{{toggleLive}}" style="height: 40px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid #D5DAE1; border-radius: 8px; background: #FFFFFF; color: #0F2A44; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{liveToggleLabel}}
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{liveChevron}}deg)"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
</div>

<template data-sc="if" value="{{liveOpen}}" hint-placeholder-val="{{true}}">
<div id="live-panel" style="border-top: 1px solid #E9ECF0; background: #FAFBFC; padding: 20px; display: flex; flex-direction: column; gap: 20px">

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px">
<!-- Bid vs reserve -->
<section aria-labelledby="h-res" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap">
<h3 id="h-res" style="margin: 0; font-size: 15px; font-weight: 700">Current bid vs your reserve</h3>
<span style="display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: #3D4A5A; background: #E9ECF0; padding: 3px 8px; border-radius: 6px">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Only you see the reserve</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #5A6675">Current bid</span>
<span style="font-size: 30px; line-height: 1.1; font-weight: 700; color: #0F2A44; letter-spacing: -0.02em">$4,250,000</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #5A6675">Hidden reserve</span>
<span style="font-size: 30px; line-height: 1.1; font-weight: 600; color: #4A5666; letter-spacing: -0.02em">$4,100,000</span>
</div>
</div>
<div role="img" aria-label="Current bid $4,250,000 is $150,000 above the $4,100,000 reserve, on a scale from the $3,500,000 starting bid to $4,500,000" style="display: flex; flex-direction: column; gap: 6px">
<div style="position: relative; height: 10px; border-radius: 999px; background: #E3E6EB">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: 75%; border-radius: 999px; background: #0F2A44"></div>
<div style="position: absolute; left: 60%; top: -5px; width: 2px; height: 20px; background: #14202E"></div>
</div>
<div style="position: relative; height: 16px; font-size: 11px; color: #5A6675">
<span style="position: absolute; left: 0">$3.5M start</span>
<span style="position: absolute; left: 60%; transform: translateX(-50%); font-weight: 600; color: #14202E">Reserve</span>
<span style="position: absolute; right: 0">$4.5M</span>
</div>
</div>
<p style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #14202E">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Reserve met · $150,000 above</p>
</section>

<!-- Sparkline -->
<section aria-labelledby="h-spark" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<h3 id="h-spark" style="margin: 0; font-size: 15px; font-weight: 700">Bids over time</h3>
<span style="font-size: 12px; color: #5A6675">18 bids since Oct 10</span>
</div>
<div role="img" aria-label="Bids rose steadily from $3,500,000 on Oct 10 to $4,250,000 today, crossing the reserve on Oct 21" style="position: relative; height: 120px">
<svg width="100%" height="100%" viewBox="0 0 300 100" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; inset: 0; overflow: visible">
<line x1="0" x2="300" y1="{{reserveY}}" y2="{{reserveY}}" stroke="#8A94A1" stroke-width="1" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"></line>
<polygon points="{{sparkArea}}" fill="#E6EEF6"></polygon>
<polyline points="{{sparkPoints}}" fill="none" stroke="#0F2A44" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>
</svg>
<span aria-hidden="true" style="position: absolute; right: -4px; top: {{endTop}}; width: 9px; height: 9px; margin-top: -4px; border-radius: 999px; background: #0F2A44; border: 2px solid #FFFFFF; box-sizing: border-box"></span>
<span aria-hidden="true" style="position: absolute; left: 4px; top: {{reserveLabelTop}}; font-size: 11px; color: #4A5666; background: #FFFFFF; padding: 0 4px">Reserve $4.1M</span>
</div>
<div aria-hidden="true" style="display: flex; justify-content: space-between; font-size: 11px; color: #5A6675"><span>Oct 10</span><span>Oct 16</span><span>Today</span></div>
</section>
</div>

<!-- Stats -->
<dl style="margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 12px">
<div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><dt style="font-size: 12px; color: #5A6675; font-weight: 500">Watchers</dt><dd style="margin: 0; font-size: 24px; font-weight: 700">42</dd></div>
<div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><dt style="font-size: 12px; color: #5A6675; font-weight: 500">NDAs signed</dt><dd style="margin: 0; font-size: 24px; font-weight: 700">11</dd></div>
<div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><dt style="font-size: 12px; color: #5A6675; font-weight: 500">Registered bidders</dt><dd style="margin: 0; font-size: 24px; font-weight: 700">6</dd></div>
<div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><dt style="font-size: 12px; color: #5A6675; font-weight: 500">Bids</dt><dd style="margin: 0; font-size: 24px; font-weight: 700">18</dd></div>
</dl>

<!-- Questions -->
<section aria-labelledby="h-q" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px">
<h3 id="h-q" style="margin: 0; font-size: 15px; font-weight: 700">Buyer questions waiting for answers</h3>
<span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #0F2A44; color: #FFFFFF; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{openQ}}</span>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<template data-sc="for" list="{{questions}}" as="q" hint-placeholder-count="2">
<li style="padding: 14px 0; border-top: 1px solid #E9ECF0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start">
<div style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-size: 14px; font-weight: 600; color: #14202E">{{q.text}}</span>
<span style="font-size: 12px; color: #5A6675">{{q.meta}}</span>
</div>
<template data-sc="if" value="{{q.canReply}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{q.open}}" style="height: 40px; padding: 0 16px; border: 1px solid #0F2A44; border-radius: 8px; background: #FFFFFF; color: #0F2A44; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 6 6v5"></path></svg>Reply</button>
</template>
<template data-sc="if" value="{{q.answered}}" hint-placeholder-val="{{false}}">
<span style="display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px; background: #E9ECF0; color: #3D4A5A; font-size: 12px; font-weight: 600">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Answered · visible to all bidders</span>
</template>
</div>
<template data-sc="if" value="{{q.editing}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="{{q.fieldId}}" style="font-size: 13px; font-weight: 600">Your answer (shown to all registered bidders)</label>
<textarea id="{{q.fieldId}}" rows="3" value="{{q.draft}}" onChange="{{q.onDraft}}" placeholder="Write a reply" style="border: 1px solid #C5CDD6; border-radius: 8px; padding: 10px 12px; font: inherit; font-size: 14px; color: #14202E; resize: vertical"></textarea>
<div style="display: flex; gap: 8px; justify-content: flex-end">
<button type="button" onClick="{{q.cancel}}" style="height: 40px; padding: 0 14px; border: 0; background: transparent; color: #0F2A44; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Cancel</button>
<button type="button" onClick="{{q.send}}" style="height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: #0F2A44; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Send reply</button>
</div>
</div>
</template>
<template data-sc="if" value="{{q.hasAnswer}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 10px 12px; border-radius: 8px; background: #F6F7F9; font-size: 14px; line-height: 1.5; color: #2B3746">{{q.answer}}</p>
</template>
</li>
</template>
</ul>
</section>
</div>
</template>
</li>

<!-- 2. ENDED - RESERVE NOT MET -->
<li style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; padding: 16px 20px">
<div style="flex: 3 1 300px; display: flex; align-items: center; gap: 14px; min-width: 0">
<span aria-hidden="true" style="width: 72px; height: 54px; border-radius: 8px; background: #DFE3E8; flex-shrink: 0"></span>
<span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<a href="#" style="font-size: 16px; font-weight: 600; color: #14202E; text-decoration: none">Super 8 Branson West</a>
<span style="font-size: 13px; color: #5A6675">Branson West, MO · 48 keys</span>
</span>
</div>
<div style="flex: 1 1 150px">
<span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: #E9ECF0; color: #3D4A5A; border: 1px solid #DDE2E8; font-size: 12px; font-weight: 600; white-space: nowrap">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>Ended – Reserve not met</span>
</div>
<div style="flex: 1 1 150px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #5A6675">Highest bid</span>
<span style="font-size: 17px; font-weight: 700; color: #0F2A44">$1,640,000</span>
</div>
<div style="flex: 1 1 150px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #5A6675">Ended</span>
<span style="font-size: 14px; color: #3D4A5A">Oct 21, 2026</span>
</div>
<div style="flex: 0 0 auto; margin-left: auto; width: 120px"></div>
</div>
<div style="border-top: 1px solid #E9ECF0; background: #FAFBFC; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
<template data-sc="if" value="{{decisionOpen}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: flex-start">
<div style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 15px; font-weight: 600; color: #14202E">The highest bid was $260,000 below your $1,900,000 reserve.</p>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #4A5666">Top bidder: Bidder 4 · proof of funds verified up to $2,500,000 · 9 bids from 3 bidders. Decide by Oct 28, 2026.</p>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" onClick="{{accept}}" style="height: 44px; padding: 0 18px; border: 0; border-radius: 8px; background: #0F2A44; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Accept highest bid anyway</button>
<button type="button" aria-expanded="{{counterOpen}}" onClick="{{toggleCounter}}" style="height: 44px; padding: 0 18px; border: 1px solid #0F2A44; border-radius: 8px; background: #FFFFFF; color: #0F2A44; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Counter-offer top bidder</button>
<a href="sell-auction-terms.html" style="height: 44px; padding: 0 18px; display: inline-flex; align-items: center; border: 1px solid #D5DAE1; border-radius: 8px; background: #FFFFFF; color: #0F2A44; text-decoration: none; font-size: 14px; font-weight: 600">Relist</a>
</div>
<template data-sc="if" value="{{counterOpen}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; padding: 14px; border: 1px solid #E3E6EB; border-radius: 10px; background: #FFFFFF">

<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    this._timer = setInterval(function () {
      var s = self.state || {};
      self.setState({ elapsed: (s.elapsed || 0) + 1 });
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this._timer); }

  renderVals() {
    var self = this;
    var s = this.state || {};
    function money(n) { return '$' + Math.round(n).toLocaleString('en-US'); }
    function num(v) { return Number(String(v || '').replace(/[^0-9]/g, '')) || 0; }

    var left = Math.max(0, 2892 - (s.elapsed || 0));
    var m = Math.floor(left / 60), sec = left % 60;
    var liveEnds = m + 'm ' + (sec < 10 ? '0' : '') + sec + 's';

    var liveOpen = s.liveOpen === undefined ? true : s.liveOpen;

    // Sparkline: day (0–13.1) and amount
    var pts = [[0.2, 3500000], [0.9, 3550000], [1.5, 3600000], [2.8, 3650000], [3.4, 3700000], [4.9, 3750000], [5.5, 3800000], [6.7, 3850000], [7.2, 3900000], [8.8, 3950000], [9.4, 4000000], [10.1, 4050000], [11.0, 4100000], [11.6, 4150000], [12.2, 4175000], [12.6, 4200000], [12.9, 4225000], [13.1, 4250000]];
    var MINV = 3450000, MAXV = 4300000, MAXD = 13.1;
    function X(d) { return (d / MAXD * 300).toFixed(1); }
    function Y(v) { return (100 - (v - MINV) / (MAXV - MINV) * 100).toFixed(1); }
    var line = pts.map(function (p) { return X(p[0]) + ',' + Y(p[1]); }).join(' ');
    var area = '0,100 ' + line + ' 300,100';
    var rY = Y(4100000);

    var qs = [
      { id: 'q1', text: 'Is the general manager willing to sign a six-month transition agreement?', meta: 'Bidder 3 · 40 min ago' },
      { id: 'q2', text: 'Can you share STR data for October once it is available?', meta: 'Bidder 12 · 3 hr ago' }
    ];
    var editing = s.editing || null;
    var drafts = s.drafts || {};
    var answers = s.answers || {};
    var questions = qs.map(function (q) {
      var ans = answers[q.id];
      var isEd = editing === q.id;
      return {
        text: q.text, meta: q.meta, fieldId: 'reply-' + q.id,
        canReply: !ans && !isEd, answered: !!ans, editing: isEd,
        hasAnswer: !!ans, answer: ans || '',
        draft: drafts[q.id] || '',
        open: function () { self.setState({ editing: q.id }); },
        cancel: function () { self.setState({ editing: null }); },
        onDraft: function (e) { var d = Object.assign({}, drafts); d[q.id] = e.target.value; self.setState({ drafts: d }); },
        send: function () {
          var t = (drafts[q.id] || '').trim(); if (!t) return;
          var a = Object.assign({}, answers); a[q.id] = t;
          self.setState({ answers: a, editing: null });
        }
      };
    });
    var openQ = qs.filter(function (q) { return !answers[q.id]; }).length;

    var decision = s.decision || null;
    var counter = s.counter === undefined ? '1,800,000' : s.counter;

    return {
      liveEnds: liveEnds,
      liveOpen: liveOpen,
      liveToggleLabel: liveOpen ? 'Hide details' : 'Show details',
      liveChevron: liveOpen ? 180 : 0,
      toggleLive: function () { self.setState({ liveOpen: !liveOpen }); },
      sparkPoints: line, sparkArea: area, reserveY: rY,
      endTop: Y(4250000) + '%',
      reserveLabelTop: 'calc(' + rY + '% - 18px)',
      questions: questions, openQ: openQ,
      decisionOpen: !decision, decisionMade: !!decision,
      decisionText: decision === 'accept' ? 'You accepted the $1,640,000 bid. Bidder 4 has been notified.' : 'Counter-offer of ' + money(num(counter)) + ' sent to Bidder 4.',
      undoDecision: function () { self.setState({ decision: null }); },
      accept: function () { self.setState({ decision: 'accept', counterOpen: false }); },
      counterOpen: !!s.counterOpen,
      toggleCounter: function () { self.setState({ counterOpen: !s.counterOpen }); },
      counter: counter,
      onCounter: function (e) { var n = num(e.target.value); self.setState({ counter: n ? n.toLocaleString('en-US') : '' }); },
      sendCounter: function () { if (num(counter)) self.setState({ decision: 'counter', counterOpen: false }); }
    };
  }
}
DC.mount(Component, {});
</script>
