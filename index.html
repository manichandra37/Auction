<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InnAuction · Buy and sell hotels at online auction</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1C1F24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F5F5F5}
a{color:#C2410C}a:hover{color:#9A3412}
.site-nav{display:flex}
.menu-btn{display:none}
@media (max-width: 920px){.site-nav{display:none}.menu-btn{display:inline-flex}.signin{display:none}}
input::placeholder{color:#6B7684}
</style>
<style>
#dc-root div[style*="overflow-x: auto"]{position:relative}
@media (max-width:860px){aside{min-width:0}}
@media (max-width:520px){
header > div{gap:12px !important;padding-left:16px !important;padding-right:16px !important}
header a[style*="padding: 0 18px; height: 44px"]{padding:0 12px !important}
}
</style>

</head>
<body>
<template id="dc-tpl">
<div style="font-family: 'Inter', system-ui, sans-serif; color: #14202E; background: #F5F5F5; font-variant-numeric: tabular-nums; min-height: 100vh">

<!-- Header -->
<header style="background: #1C1F24; border-bottom: 1px solid rgba(255,255,255,0.08)">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 24px; height: 72px; display: flex; align-items: center; gap: 32px">
<a href="#" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF; flex-shrink: 0">
<span style="width: 32px; height: 32px; border-radius: 8px; background: #E8590C; display: inline-flex; align-items: center; justify-content: center">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.8 11.6 12 5.3l8.2 6.3"></path><circle cx="12" cy="13.9" r="2.45" fill="#FFFFFF" stroke="none"></circle><path d="M10.5 15h3l.8 3.75h-4.6z" fill="#FFFFFF" stroke="none"></path></svg>
</span>
<span style="font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Inn<span style="font-weight: 400">Auction</span></span>
</a>
<nav class="site-nav" aria-label="Main" style="align-items: center; gap: 4px; flex: 1 1 auto">
<a href="search.html" style="color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 500; padding: 12px 14px; border-radius: 8px">Buy hotels</a>
<a href="sell-financials.html" style="color: #D1D5DB; text-decoration: none; font-size: 15px; font-weight: 500; padding: 12px 14px; border-radius: 8px">Sell a hotel</a>
<a href="#how" style="color: #D1D5DB; text-decoration: none; font-size: 15px; font-weight: 500; padding: 12px 14px; border-radius: 8px">How it works</a>
<a href="my-bids.html" style="color: #D1D5DB; text-decoration: none; font-size: 15px; font-weight: 500; padding: 12px 14px; border-radius: 8px">My bids</a>
</nav>
<div style="display: flex; align-items: center; gap: 8px; margin-left: auto">
<a href="my-bids.html" class="signin" style="color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 500; padding: 12px 14px">Sign in</a>
<a href="sell-financials.html" style="background: #C2410C; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600; padding: 0 18px; height: 44px; display: inline-flex; align-items: center; border-radius: 8px; white-space: nowrap">List your hotel</a>
<button type="button" class="menu-btn" aria-label="Open menu" style="width: 44px; height: 44px; align-items: center; justify-content: center; background: transparent; border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; color: #FFFFFF; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
</button>
</div>
</div>
</header>

<main>
<!-- Hero -->
<section style="background: linear-gradient(rgba(18,20,24,0.74), rgba(18,20,24,0.74)), url('https://images.unsplash.com/photo-1445019980597-93fa8acb246c?auto=format&fit=crop&w=900&q=70') center / cover no-repeat #1C1F24; padding: 96px 24px 104px">
<div style="max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 760px">
<h1 style="margin: 0; color: #FFFFFF; font-size: clamp(34px, 4.4vw, 56px); line-height: 1.08; font-weight: 700; letter-spacing: -0.025em">Buy and sell hotels at online auction</h1>
<p style="margin: 0; color: #C8CDD3; font-size: 19px; line-height: 1.5">Verified listings, real financials, transparent live bidding.</p>
</div>

<form role="search" aria-label="Search hotel auctions" style="background: #FFFFFF; border-radius: 12px; padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; box-shadow: 0 12px 32px rgba(5,18,32,0.28)">
<div style="flex: 2 1 240px; display: flex; flex-direction: column; gap: 6px; padding: 6px 8px">
<label for="loc" style="font-size: 12px; font-weight: 600; color: #4A5666; letter-spacing: 0.02em">Location</label>
<input id="loc" type="text" placeholder="City, state or market" style="height: 44px; border: 1px solid #D5DAE1; border-radius: 8px; padding: 0 12px; font: inherit; font-size: 15px; color: #14202E; background: #FFFFFF; min-width: 0">
</div>
<div style="flex: 2 1 200px; display: flex; flex-direction: column; gap: 6px; padding: 6px 8px">
<label for="type" style="font-size: 12px; font-weight: 600; color: #4A5666; letter-spacing: 0.02em">Hotel type</label>
<select id="type" style="height: 44px; border: 1px solid #D5DAE1; border-radius: 8px; padding: 0 10px; font: inherit; font-size: 15px; color: #14202E; background: #FFFFFF">
<option>All types</option>
<option>Limited-service</option>
<option>Full-service</option>
<option>Boutique</option>
<option>Motel</option>
<option>Extended-stay</option>
<option>Resort</option>
</select>
</div>
<div style="flex: 2 1 200px; display: flex; flex-direction: column; gap: 6px; padding: 6px 8px">
<label for="price" style="font-size: 12px; font-weight: 600; color: #4A5666; letter-spacing: 0.02em">Price range</label>
<select id="price" style="height: 44px; border: 1px solid #D5DAE1; border-radius: 8px; padding: 0 10px; font: inherit; font-size: 15px; color: #14202E; background: #FFFFFF">
<option>Any price</option>
<option>Under $1M</option>
<option>$1M – $3M</option>
<option>$3M – $10M</option>
<option>$10M – $25M</option>
<option>$25M+</option>
</select>
</div>
<div style="flex: 1 0 140px; padding: 6px 8px">
<a href="search.html" style="width: 100%; box-sizing: border-box; height: 44px; background: #1F7A4D; color: #FFFFFF; text-decoration: none; border-radius: 8px; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
Search
</a>
</div>
</form>

<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<span style="color: #C8CDD3; font-size: 14px; margin-right: 4px">Quick filters:</span>
<template data-sc="for" list="{{chips}}" as="chip" hint-placeholder-count="5">
<template data-sc="if" value="{{chip.on}}" hint-placeholder-val="{{false}}">
<button type="button" aria-pressed="true" onClick="{{chip.toggle}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #FFFFFF; background: #FFFFFF; color: #1C1F24; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{chip.label}}</button>
</template>
<template data-sc="if" value="{{chip.off}}" hint-placeholder-val="{{true}}">
<button type="button" aria-pressed="false" onClick="{{chip.toggle}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.4); background: transparent; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">{{chip.label}}</button>
</template>
</template>
</div>
</div>
</section>

<!-- Live auctions -->
<section style="padding: 64px 24px 24px">
<div style="max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; color: #1C1F24">Live hotel auctions</h2>
<p style="margin: 0; font-size: 15px; color: #5A6675">37 properties open for bidding right now</p>
</div>
<a href="search.html" style="font-size: 15px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; padding: 10px 0">View all auctions
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</a>
</div>

<div style="display: flex; gap: 4px; border-bottom: 1px solid #DDE2E8; overflow-x: auto">
<template data-sc="for" list="{{tabs}}" as="tab" hint-placeholder-count="3">
<template data-sc="if" value="{{tab.selected}}" hint-placeholder-val="{{false}}">
<button type="button" aria-pressed="true" onClick="{{tab.pick}}" style="height: 48px; padding: 0 16px; background: transparent; border: 0; border-bottom: 2px solid #E8590C; margin-bottom: -1px; color: #1C1F24; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap">{{tab.label}}</button>
</template>
<template data-sc="if" value="{{tab.unselected}}" hint-placeholder-val="{{true}}">
<button type="button" aria-pressed="false" onClick="{{tab.pick}}" style="height: 48px; padding: 0 16px; background: transparent; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; color: #5A6675; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap">{{tab.label}}</button>
</template>
</template>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 272px), 1fr)); gap: 20px">
<template data-sc="for" list="{{cards}}" as="item" hint-placeholder-count="4">
<article style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column">
<div style="position: relative; aspect-ratio: 4 / 3; background: #DFE3E8; overflow: hidden">
<img src="{{item.photo}}" alt="{{item.photoAlt}}" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; color: transparent">
<div style="position: absolute; top: 12px; left: 12px; display: flex; gap: 6px">
<template data-sc="if" value="{{item.soon}}" hint-placeholder-val="{{true}}">
<span style="display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px; background: #FEF9C3; color: #713F12; font-size: 12px; font-weight: 600; border: 1px solid #FDE047">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
{{item.ends}}</span>
</template>
<template data-sc="if" value="{{item.later}}" hint-placeholder-val="{{false}}">
<span style="display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px; background: #FFFFFF; color: #3D4A5A; font-size: 12px; font-weight: 600; border: 1px solid #DDE2E8">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
{{item.ends}}</span>
</template>
</div>
<span style="position: absolute; left: 12px; bottom: 12px; height: 26px; padding: 0 10px; display: inline-flex; align-items: center; border-radius: 6px; background: #1C1F24; color: #FFFFFF; font-size: 12px; font-weight: 600">{{item.type}}</span>
<template data-sc="if" value="{{item.watched}}" hint-placeholder-val="{{false}}">
<button type="button" aria-pressed="true" aria-label="{{item.heartLabel}}" onClick="{{item.toggle}}" style="position: absolute; top: 6px; right: 6px; width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<span style="width: 34px; height: 34px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(28,31,36,0.2)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="#C8372D" stroke="#C8372D" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-9.2-9A4.8 4.8 0 0 1 12 6.3 4.8 4.8 0 0 1 21.2 11C19 15.6 12 20 12 20z"></path></svg>
</span>
</button>
</template>
<template data-sc="if" value="{{item.notWatched}}" hint-placeholder-val="{{true}}">
<button type="button" aria-pressed="false" aria-label="{{item.heartLabel}}" onClick="{{item.toggle}}" style="position: absolute; top: 6px; right: 6px; width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<span style="width: 34px; height: 34px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(28,31,36,0.2)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3D4A5A" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-9.2-9A4.8 4.8 0 0 1 12 6.3 4.8 4.8 0 0 1 21.2 11C19 15.6 12 20 12 20z"></path></svg>
</span>
</button>
</template>
</div>

<div style="padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; flex: 1 1 auto">
<div style="display: flex; flex-direction: column; gap: 4px">
<h3 style="margin: 0; font-size: 17px; font-weight: 600; line-height: 1.3"><a href="listing.html" style="color: #14202E; text-decoration: none">{{item.name}}</a></h3>
<p style="margin: 0; font-size: 14px; color: #5A6675">{{item.city}}</p>
</div>
<p style="margin: 0; font-size: 13px; color: #3D4A5A">{{item.meta}}</p>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; background: #F5F5F5; border-radius: 8px; padding: 10px 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<dt style="font-size: 11px; color: #5A6675; font-weight: 500">Occupancy</dt>
<dd style="margin: 0; font-size: 15px; font-weight: 600; color: #14202E; font-variant-numeric: tabular-nums">{{item.occ}}</dd>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<dt style="font-size: 11px; color: #5A6675; font-weight: 500">ADR</dt>
<dd style="margin: 0; font-size: 15px; font-weight: 600; color: #14202E; font-variant-numeric: tabular-nums">{{item.adr}}</dd>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<dt style="font-size: 11px; color: #5A6675; font-weight: 500">Cap rate</dt>
<dd style="margin: 0; font-size: 15px; font-weight: 600; color: #14202E; font-variant-numeric: tabular-nums">{{item.cap}}</dd>
</div>
</dl>
<div style="border-top: 1px solid #E9ECF0; padding-top: 12px; margin-top: auto; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #5A6675; font-weight: 500">Current bid</span>
<span style="font-size: 26px; font-weight: 700; color: #1C1F24; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">{{item.bid}}</span>
<span style="font-size: 13px; color: #3D4A5A; display: flex; align-items: center; gap: 6px; flex-wrap: wrap">
<span style="font-variant-numeric: tabular-nums">{{item.bids}}</span>
<span aria-hidden="true" style="color: #A9B2BD">·</span>
<template data-sc="if" value="{{item.reserveMet}}" hint-placeholder-val="{{true}}">
<span style="display: inline-flex; align-items: center; gap: 4px; font-weight: 600; color: #14202E">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Reserve met</span>
</template>
<template data-sc="if" value="{{item.reserveNot}}" hint-placeholder-val="{{false}}">
<span style="color: #5A6675">Reserve not met</span>
</template>
</span>
</div>
</div>
</article>
</template>
</div>
</div>
</section>

<!-- How it works -->
<section id="how" style="padding: 56px 24px 72px">
<div style="max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; color: #1C1F24">How it works</h2>
<p style="margin: 0; font-size: 15px; color: #5A6675">Every bidder is verified before the first bid. Every listing comes with its numbers.</p>
</div>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 20px">
<li style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 28px; display: flex; flex-direction: column; gap: 14px">
<span style="width: 40px; height: 40px; border-radius: 999px; border: 1.5px solid #1C1F24; color: #1C1F24; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">1</span>
<h3 style="margin: 0; font-size: 19px; font-weight: 600; color: #14202E">Sign NDA and verify funds</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #4A5666">Create an account, sign a one-time NDA, and upload proof of funds or a lender letter. Verification usually takes one business day.</p>
</li>
<li style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 28px; display: flex; flex-direction: column; gap: 14px">
<span style="width: 40px; height: 40px; border-radius: 999px; border: 1.5px solid #1C1F24; color: #1C1F24; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">2</span>
<h3 style="margin: 0; font-size: 19px; font-weight: 600; color: #14202E">Review financials and bid</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #4A5666">Open the data room for the trailing-12 P&amp;L, STR reports, franchise agreement and PIP. Bid live, or set a maximum and let proxy bidding work for you.</p>
</li>
<li style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 28px; display: flex; flex-direction: column; gap: 14px">
<span style="width: 40px; height: 40px; border-radius: 999px; border: 1.5px solid #1C1F24; color: #1C1F24; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">3</span>
<h3 style="margin: 0; font-size: 19px; font-weight: 600; color: #14202E">Win, then close with escrow</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #4A5666">The winning bidder signs the purchase agreement and wires the deposit to a licensed escrow agent. A typical close takes 30 to 45 days.</p>
</li>
</ol>
</div>
</section>

<!-- Seller band -->
<section style="background: #FFF1E6; padding: 56px 24px">
<div style="max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 8px; max-width: 640px">
<h2 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; color: #1C1F24">Own a hotel? List it in minutes</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #3D4A5A">Upload your T-12 and photos, set a reserve price, and reach verified buyers across the country.</p>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
<a href="#" style="font-size: 15px; font-weight: 600; text-decoration: none; padding: 12px 4px">See seller fees</a>
<a href="sell-financials.html" style="background: #C2410C; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 600; padding: 0 24px; height: 48px; display: inline-flex; align-items: center; border-radius: 8px">List your hotel</a>
</div>
</div>
</section>
</main>

<!-- Footer -->
<footer style="background: #FFFFFF; border-top: 1px solid #E3E6EB; padding: 32px 24px">
<div style="max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 26px; height: 26px; border-radius: 6px; background: #E8590C; display: inline-flex; align-items: center; justify-content: center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.8 11.6 12 5.3l8.2 6.3"></path><circle cx="12" cy="13.9" r="2.45" fill="#FFFFFF" stroke="none"></circle><path d="M10.5 15h3l.8 3.75h-4.6z" fill="#FFFFFF" stroke="none"></path></svg>
</span>
<span style="font-size: 14px; color: #5A6675">© 2026 InnAuction. All rights reserved.</span>
</div>
<nav aria-label="Footer" style="display: flex; flex-wrap: wrap; gap: 4px 8px">
<a href="#" style="color: #3D4A5A; text-decoration: none; font-size: 14px; padding: 10px 8px">Auction rules</a>
<a href="#" style="color: #3D4A5A; text-decoration: none; font-size: 14px; padding: 10px 8px">FAQ</a>
<a href="#" style="color: #3D4A5A; text-decoration: none; font-size: 14px; padding: 10px 8px">Terms</a>
<a href="#" style="color: #3D4A5A; text-decoration: none; font-size: 14px; padding: 10px 8px">Privacy</a>
<a href="#" style="color: #3D4A5A; text-decoration: none; font-size: 14px; padding: 10px 8px">Contact</a>
</nav>
</div>
